<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Global Sport Finance Financial Insight"><title>Financial Insight | Global Sport Finance</title><link rel="stylesheet" href="/financial-insights.css"></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="/finance.html"><img src="/assets/images/gmc-logo.png" alt="GMC"><div><strong>Global Sport Finance</strong><small>Powered by Global Management Consultancy</small></div></a><div class="top-actions"><a class="back" href="/financial-insights.html" id="backLibrary">← Back to Financial Insights</a><div class="lang"><button data-language="en">EN</button><button data-language="fr">FR</button><button data-language="es">ES</button></div></div></div></header><main><article class="article-wrap" id="article"></article></main><footer class="footer"><div class="container">© <span id="year"></span> Global Management Consultancy Limited.</div></footer><script src="/financial-insights.js"></script><script>
const langButtons=[...document.querySelectorAll('[data-language]')];const id=new URLSearchParams(location.search).get('id');const pub=GSF_INSIGHTS.find(p=>p.id===id);
function fmtDate(value,lang){return new Intl.DateTimeFormat({en:'en-GB',fr:'fr-FR',es:'es-ES'}[lang],{day:'2-digit',month:'long',year:'numeric'}).format(new Date(value+'T12:00:00'));}
function setLanguage(lang){if(!GSF_INSIGHTS_UI[lang])lang='en';localStorage.setItem('gsf-language',lang);document.documentElement.lang=lang;langButtons.forEach(b=>b.classList.toggle('active',b.dataset.language===lang));const ui=GSF_INSIGHTS_UI[lang];backLibrary.textContent=ui.backLibrary;if(!pub){article.innerHTML=`<h1>${ui.notFound}</h1><p><a class="read" href="/financial-insights.html">${ui.backLibrary}</a></p>`;return;}const c=pub[lang]||pub.en;document.title=c.title+' | Global Sport Finance';const body=c.sections.map(s=>`<section><h2>${s.heading}</h2>${(s.paragraphs||[]).map(p=>`<p>${p}</p>`).join('')}${s.quote?`<div class="quote">“${s.quote}”</div>`:''}</section>`).join('');const flyer=pub.flyer?`<aside class="side"><div class="flyer"><div class="flyer-label">${ui.flyer}</div><a href="${pub.flyer}" target="_blank" rel="noopener" aria-label="${ui.flyer}: ${c.title}"><img src="${pub.flyer}" alt="${c.title} publication flyer" title="Open full-size flyer"></a></div></aside>`:'';article.innerHTML=`<div class="article-meta">${ui.library} ${pub.number} · ${ui.published}: ${fmtDate(pub.date,lang)}</div><h1>${c.title}</h1><p class="subtitle">${c.subtitle||c.card}</p><div class="article-grid"><div class="article-body">${body}<div class="notice">${ui.disclaimer}</div></div>${flyer}</div>`;}
langButtons.forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.language)));year.textContent=new Date().getFullYear();setLanguage(localStorage.getItem('gsf-language')||'en');
</script></body></html>

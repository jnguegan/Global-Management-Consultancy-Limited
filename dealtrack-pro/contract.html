<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DealTrack Pro — Contract</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/agent-academy/js/supabase-client.js"></script>
  <script src="/agent-academy/js/auth.js"></script>
  <script src="/agent-academy/js/guard.js"></script>

  <style>
    :root {
      --bg: #020b1d;
      --bg-2: #07152f;
      --panel: rgba(10, 24, 52, 0.88);
      --panel-strong: rgba(12, 28, 58, 0.96);
      --panel-soft: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(212, 175, 55, 0.22);
      --text: #f6f8fc;
      --muted: #9fb0cf;
      --blue: #2f8cff;
      --blue-2: #58a6ff;
      --gold: #d4af37;
      --gold-2: #f0c85a;
      --danger: #ef4444;
      --shadow: 0 18px 60px rgba(0,0,0,0.36);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(47,140,255,0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(212,175,55,0.12), transparent 24%),
        linear-gradient(180deg, #010814 0%, #05122a 45%, #020b1d 100%);
      min-height: 100vh;
      padding: 24px;
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: grid;
      gap: 12px;
      padding: 14px 0 16px;
      margin-bottom: 24px;
      background: linear-gradient(
        180deg,
        rgba(2, 11, 29, 0.985),
        rgba(2, 11, 29, 0.93)
      );
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 12px 28px rgba(0,0,0,0.16);
    }

    .topbar-primary,
    .topbar-secondary,
    .topbar-brand-nav,
    .topbar-tools,
    .topbar-session-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .topbar-primary,
    .topbar-secondary {
      justify-content: space-between;
      gap: 14px;
    }

    .topbar-tools {
      flex-wrap: wrap;
    }

    .topbar-session-actions {
      justify-content: flex-end;
      margin-left: auto;
    }

    .identity-bar {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 285px;
      max-width: 390px;
      padding: 8px 10px 8px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
    }

    .identity-avatar {
      display: grid;
      place-items: center;
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #08111f;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      font-size: 0.78rem;
      font-weight: 950;
      letter-spacing: 0.02em;
    }

    .identity-copy {
      min-width: 0;
      line-height: 1.22;
    }

    .identity-label,
    .identity-name,
    .identity-agency,
    .identity-email {
      display: block;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .identity-label {
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .identity-name {
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 900;
    }

    .identity-agency {
      color: var(--gold-2);
      font-size: 0.72rem;
      font-weight: 800;
    }

    .identity-email {
      color: var(--muted);
      font-size: 0.69rem;
      font-weight: 650;
    }

    .topbar-logout {
      min-height: 38px;
      padding: 0 12px;
      white-space: nowrap;
    }

    .topbar .lang-switcher {
      flex-wrap: nowrap;
    }

    .topbar .lang-btn {
      min-width: 44px;
      min-height: 38px;
    }

    .brand {
  display: flex;
  flex-direction: column;
  margin-right: 12px;
}

.brand-title {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: #ffffff;
}

.brand-sub {
  font-size: 11px;
  color: var(--gold-2);
  opacity: 0.85;
  letter-spacing: 0.08em;
}

    .brand-title {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: -0.02em;
}

.brand-main {
  color: #ffffff;
}

.brand-pro {
  color: #d4af37;
  margin-left: 6px;
}

.brand-tagline {
  font-size: 11px;
  color: #bfa046;
  margin-top: 2px;
}
    .back-link,
    .btn,
    .lang-btn {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      transition: 0.2s ease;
    }

    .back-link,
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 16px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .back-link:hover,
    .btn:hover,
    .lang-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.16);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-2) 100%);
      border-color: rgba(88,166,255,0.35);
      color: white;
      box-shadow: 0 14px 30px rgba(47,140,255,0.22);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-2) 100%);
      color: #09111f;
      border-color: rgba(212,175,55,0.55);
      box-shadow: 0 14px 30px rgba(212,175,55,0.18);
    }

    .lang-switcher {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .lang-btn {
      min-width: 54px;
      min-height: 46px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 700;
      opacity: 0.86;
    }

    .lang-btn.is-active {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-2) 100%);
      border-color: rgba(88,166,255,0.35);
      color: #fff;
      opacity: 1;
      box-shadow: 0 10px 24px rgba(47,140,255,0.24);
    }

    .hero {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(47,140,255,0.12), transparent 42%),
        linear-gradient(160deg, rgba(212,175,55,0.08), transparent 55%),
        var(--panel-strong);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 30px 30px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 85% 20%, rgba(212,175,55,0.12), transparent 25%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold-2);
      margin-bottom: 14px;
      font-weight: 700;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 0;
      max-width: 820px;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.65;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.95rem;
    }

    .meta-pill strong {
      color: var(--gold-2);
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 0.95fr;
      gap: 22px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 22px;
    }

    .premium-card {
      background: linear-gradient(180deg, rgba(11,24,52,0.96), rgba(7,20,43,0.96));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .section-kicker {
      font-size: 0.84rem;
      color: var(--gold-2);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .data-tile {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 16px 16px 15px;
      min-height: 92px;
    }

    .tile-label {
      display: block;
      font-size: 0.8rem;
      line-height: 1.2;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .tile-value {
      font-size: 1rem;
      line-height: 1.45;
      color: var(--text);
      word-break: break-word;
      font-weight: 600;
    }

    .summary-card {
      padding: 0;
      overflow: hidden;
    }

    .summary-top {
      padding: 22px 22px 18px;
      border-bottom: 1px solid var(--border);
      background:
        linear-gradient(135deg, rgba(47,140,255,0.08), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    }

    .summary-top h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    .summary-top p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .summary-list {
      padding: 18px 22px 22px;
      display: grid;
      gap: 12px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .summary-row .left {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .summary-row .right {
      color: var(--text);
      font-weight: 700;
      text-align: right;
    }

    .commercial-value-card {
  position: relative;
  overflow: hidden;
  border-color: rgba(212, 175, 55, 0.34);
  background:
    radial-gradient(
      circle at top right,
      rgba(240, 200, 90, 0.13),
      transparent 34%
    ),
    linear-gradient(
      145deg,
      rgba(212, 175, 55, 0.09),
      rgba(8, 22, 48, 0.98) 48%
    );
}

.commercial-value-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 22px;
  right: 22px;
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--gold),
    transparent
  );
}

.commercial-value-headline {
  padding: 22px;
  margin-bottom: 16px;
  border: 1px solid rgba(212, 175, 55, 0.2);
  border-radius: 20px;
  background: rgba(212, 175, 55, 0.055);
  text-align: center;
}

.commercial-value-label {
  display: block;
  margin-bottom: 9px;
  color: var(--muted);
  font-size: 0.77rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.commercial-value-annual {
  color: var(--gold-2);
  font-size: clamp(2rem, 5vw, 3.2rem);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.045em;
}

.commercial-value-period {
  margin-top: 9px;
  color: var(--muted);
  font-size: 0.9rem;
}

.commercial-total-box {
  padding: 20px;
  margin-bottom: 16px;
  border: 1px solid rgba(88, 166, 255, 0.17);
  border-radius: 18px;
  background: rgba(47, 140, 255, 0.055);
  text-align: center;
}

.commercial-total-value {
  margin-top: 7px;
  color: var(--text);
  font-size: clamp(1.55rem, 4vw, 2.25rem);
  font-weight: 900;
  letter-spacing: -0.035em;
}

.commercial-breakdown {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.commission-side-box {
  padding: 16px;
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 17px;
  background: rgba(255, 255, 255, 0.025);
}

.commission-side-title {
  margin-bottom: 12px;
  color: var(--gold-2);
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.commission-side-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.055);
}

.commission-side-row:last-child {
  border-bottom: 0;
}

.commission-side-row span {
  color: var(--muted);
  font-size: 0.84rem;
}

.commission-side-row strong {
  color: var(--text);
  text-align: right;
}

.commercial-calculation {
  margin-top: 16px;
  padding: 15px;
  border-radius: 16px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.025);
  font-size: 0.88rem;
  line-height: 1.65;
}

    .commercial-calculation h4 {
  margin: 0 0 16px;
  color: var(--gold-2);
  font-size: 0.9rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.commercial-calculation-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.commercial-calculation-grid > div {
  padding: 14px;
  border: 1px solid rgba(255, 255, 255, 0.065);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.025);
}

.commercial-calculation-grid span {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.commercial-calculation-grid strong {
  color: var(--text);
  font-size: 1rem;
  line-height: 1.4;
}

.commercial-note {
  margin: 16px 0 0;
  color: var(--muted);
  font-size: 0.84rem;
  line-height: 1.6;
}



    .calculation-formula {
      margin-top: 14px;
      padding: 14px 16px;
      border: 1px solid rgba(88,166,255,0.18);
      border-radius: 14px;
      background: rgba(47,140,255,0.055);
      color: var(--text);
      line-height: 1.55;
      font-size: 0.92rem;
      word-break: break-word;
    }

    .calculation-formula strong {
      color: var(--gold-2);
    }

    .audit-schedule {
      margin-top: 16px;
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 15px;
    }

    .audit-schedule table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    .audit-schedule th,
    .audit-schedule td {
      padding: 11px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      text-align: left;
      vertical-align: top;
      font-size: 0.84rem;
    }

    .audit-schedule th {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.025);
    }

    .audit-schedule tr:last-child td { border-bottom: 0; }
@media (max-width: 620px) {
  .commercial-calculation-grid {
    grid-template-columns: 1fr;
  }
}

.invoice-forecast-card {
  position: relative;
  overflow: hidden;
  border-color: rgba(88, 166, 255, 0.24);
  background:
    radial-gradient(
      circle at top right,
      rgba(47, 140, 255, 0.12),
      transparent 34%
    ),
    linear-gradient(
      145deg,
      rgba(47, 140, 255, 0.06),
      rgba(8, 22, 48, 0.98) 52%
    );
}

.invoice-opportunities {
  display: grid;
  gap: 14px;
  margin-top: 18px;
}

.invoice-opportunity {
  padding: 18px;
  border: 1px solid rgba(255, 255, 255, 0.075);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.025);
}

.invoice-opportunity-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 16px;
}

.invoice-opportunity-title {
  color: var(--gold-2);
  font-size: 0.88rem;
  font-weight: 900;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.invoice-status {
  display: inline-flex;
  align-items: center;
  min-height: 30px;
  padding: 0 10px;
  border: 1px solid rgba(245, 158, 11, 0.26);
  border-radius: 999px;
  color: #ffe0a3;
  background: rgba(245, 158, 11, 0.09);
  font-size: 0.75rem;
  font-weight: 800;
}

.invoice-amount-box {
  padding: 18px;
  margin-bottom: 14px;
  border: 1px solid rgba(212, 175, 55, 0.2);
  border-radius: 16px;
  background: rgba(212, 175, 55, 0.055);
}

.invoice-amount-label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 0.77rem;
  font-weight: 800;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.invoice-amount-value {
  color: var(--gold-2);
  font-size: clamp(2.4rem, 6vw, 3.8rem);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.04em;
}

.invoice-details-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.invoice-detail {
  padding: 13px;
  border: 1px solid rgba(255, 255, 255, 0.055);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.02);
}

.invoice-detail span {
  display: block;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 0.73rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.invoice-detail strong {
  color: var(--text);
  font-size: 0.94rem;
  line-height: 1.45;
}

.invoice-forecast-note {
  margin: 16px 0 0;
  padding: 14px;
  border-radius: 14px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.02);
  font-size: 0.84rem;
  line-height: 1.6;
}

@media (max-width: 620px) {
  .invoice-details-grid {
    grid-template-columns: 1fr;
  }

  .invoice-opportunity-head {
    flex-direction: column;
  }
}

.commercial-warning {
  padding: 17px;
  border: 1px solid rgba(245, 158, 11, 0.25);
  border-radius: 17px;
  color: #ffe4ad;
  background: rgba(245, 158, 11, 0.08);
  line-height: 1.6;
}

@media (max-width: 620px) {
  .commercial-breakdown {
    grid-template-columns: 1fr;
  }
}
    
    .status-box {
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.18);
      color: #ffd5d5;
    }

    .muted {
      color: var(--muted);
    }

    .empty {
      color: var(--muted);
      font-weight: 600;
    }

    @media (max-width: 1050px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 16px;
      }

      .hero,
      .premium-card {
        padding: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding-top: 10px;
      }

      .back-link,
      .btn {
        width: 100%;
      }

      .topbar-primary,
      .topbar-secondary {
        flex-direction: column;
        align-items: stretch;
      }

      .topbar-brand-nav,
      .topbar-session-actions,
      .topbar-tools,
      .actions {
        width: 100%;
      }

      .topbar-brand-nav,
      .topbar-session-actions {
        justify-content: space-between;
      }

      .topbar-tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .identity-bar {
        width: 100%;
        max-width: none;
      }
    }
  </style>
</head>
<body>

  <script>
    const I18N = JSON.parse(document.getElementById("dealtrack-contract-i18n").textContent);
    let currentLang = localStorage.getItem("lang") || "en";
    let currentContract = null;
    let currentContractInstalments = [];
    let currentUser = null;
    let currentAgency = null;

    function t(key) {
      return I18N[currentLang]?.[key] || I18N.en?.[key] || key;
    }

    function getUserDisplayName(user) {
      const metadata = user?.user_metadata || {};
      const fullName =
        metadata.full_name ||
        metadata.name ||
        [metadata.first_name, metadata.last_name].filter(Boolean).join(" ");

      return String(fullName || user?.email?.split("@")[0] || "User")
        .trim()
        .replace(/[._-]+/g, " ")
        .replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    async function loadAgencyContext(db) {
      const { data, error } = await db.rpc("get_my_agency_context");

      if (error) {

function toNumber(value) {
  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return null;
  }

  if (typeof value === "number") {
    return Number.isFinite(value)
      ? value
      : null;
  }

  const cleaned = String(value)
    .replace(/\s/g, "")
    .replace(/,/g, "")
    .replace(/[^\d.-]/g, "");

  if (!cleaned) {
    return null;
  }

  const number = Number(cleaned);

  return Number.isFinite(number)
    ? number
    : null;
}

function normaliseFrequency(value) {
  return String(value || "")
    .trim()
    .toLowerCase();
}

function calculateAnnualSalary(
  salaryAmount,
  salaryFrequency
) {
  const salary =
    toNumber(salaryAmount);

  if (salary === null) {
    return null;
  }

  const frequency =
    normaliseFrequency(salaryFrequency);

  const frequencyMultipliers = {
    weekly: 52,
    week: 52,
    hebdomadaire: 52,
    semanal: 52,

    monthly: 12,
    month: 12,
    mensuel: 12,
    mensuelle: 12,
    mensual: 12,

    fortnightly: 26,
    biweekly: 26,
    quinzaine: 26,
    quincenal: 26,

    yearly: 1,
    annual: 1,
    annually: 1,
    year: 1,
    annuel: 1,
    annuelle: 1,
    anual: 1
  };

  const multiplier =
    frequencyMultipliers[frequency];

  if (!multiplier) {
    return null;
  }

  return salary * multiplier;
}

function calculateContractYears(
  startDateValue,
  endDateValue
) {
  if (!startDateValue || !endDateValue) {
    return null;
  }

  const startDate =
    new Date(`${startDateValue}T00:00:00`);

  const endDate =
    new Date(`${endDateValue}T00:00:00`);

  if (
    Number.isNaN(startDate.getTime()) ||
    Number.isNaN(endDate.getTime()) ||
    endDate <= startDate
  ) {
    return null;
  }

  const millisecondsPerYear =
    365.2425 * 24 * 60 * 60 * 1000;

  const exactYears =
    (endDate - startDate) /
    millisecondsPerYear;

  return Math.max(
    1,
    Math.round(exactYears)
  );
}

function formatMoneyValue(
  amount,
  currency
) {
  const numericAmount =
    toNumber(amount);

  if (numericAmount === null) {
    return t("na");
  }

  const localeMap = {
    en: "en-GB",
    fr: "fr-FR",
    es: "es-ES"
  };

  try {
    return new Intl.NumberFormat(
      localeMap[currentLang] || "en-GB",
      {
        style: "currency",
        currency: currency || "GBP",
        maximumFractionDigits: 0
      }
    ).format(numericAmount);
  } catch {
    return `${numericAmount.toLocaleString()} ${
      currency || ""
    }`.trim();
  }
}

function normaliseCommissionMethod(data) {
  const explicit = String(
    data.commission_method ||
    data.commission_type ||
    ""
  ).trim().toLowerCase();

  if (
    explicit === "percentage" ||
    explicit.includes("percentage") ||
    explicit.includes("%")
  ) return "percentage";

  if (
    explicit === "fixed" ||
    explicit.includes("fixed")
  ) return "fixed";

  if (
    explicit === "mixed" ||
    explicit.includes("mixed")
  ) return "mixed";

  if (
    toNumber(data.commission_percentage) !== null &&
    toNumber(data.fixed_commission_amount) !== null
  ) return "mixed";

  if (toNumber(data.fixed_commission_amount) !== null) return "fixed";
  if (toNumber(data.commission_percentage) !== null) return "percentage";

  return "unknown";
}

function getCommissionBasis(data, annualSalary) {
  const basis = String(
    data.commission_basis || "basic_salary"
  ).trim().toLowerCase();

  const signingBonus =
    toNumber(data.signing_bonus) || 0;
  const guaranteedBonus =
    toNumber(data.guaranteed_bonus) || 0;
  const otherIncome =
    toNumber(data.other_commissionable_income) || 0;
  const customBasis =
    toNumber(data.custom_commission_basis_amount);

  if (basis === "custom" && customBasis !== null) {
    return {
      recurring: customBasis,
      oneOff: 0,
      total: customBasis
    };
  }

  const recurring = annualSalary || 0;
  let oneOff = 0;

  if (
    basis === "salary_plus_signing_bonus" ||
    basis === "guaranteed_remuneration" ||
    basis === "total_gross_remuneration" ||
    Boolean(data.signing_bonus_commissionable)
  ) oneOff += signingBonus;

  if (
    basis === "guaranteed_remuneration" ||
    basis === "total_gross_remuneration" ||
    Boolean(data.guaranteed_bonus_commissionable)
  ) oneOff += guaranteedBonus;

  if (
    basis === "total_gross_remuneration" ||
    Boolean(data.other_income_commissionable)
  ) oneOff += otherIncome;

  return {
    recurring,
    oneOff,
    total: recurring + oneOff
  };
}


function getAnnualisationRule(frequency) {
  const value = normaliseFrequency(frequency);
  if (["weekly", "week", "hebdomadaire", "semanal"].includes(value)) return { multiplier: 52, label: t("weeklyRule") };

  if (["yearly", "annual", "annually", "year", "annuel", "annuelle", "anual"].includes(value)) return { multiplier: 1, label: t("annualRule") };

function parseAnalysisJson(data) {
  const raw = data?.analysis_json;
  if (!raw) return null;

  if (typeof raw === "object") {
    return raw;

  if (typeof raw === "string") {
    try {
      return JSON.parse(raw);
    } catch (error) {
      console.warn("Could not parse analysis_json:", error);
    }
  }

  return null;
}

function normaliseScheduleDate(value) {
  if (!value) return null;

  const text = String(value).trim();

  // Supabase dates are normally YYYY-MM-DD. Keep them stable and avoid
  // timezone conversion changing the displayed day.
  if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
    return text;
  }

  const parsed = new Date(text);
  if (Number.isNaN(parsed.getTime())) return null;

  const year = parsed.getFullYear();
  const month = String(parsed.getMonth() + 1).padStart(2, "0");
  const day = String(parsed.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function inferFootballSeasonFromDate(dateValue) {
  const date = normaliseScheduleDate(dateValue);
  if (!date) return "";

  const [yearText, monthText] = date.split("-");
  const year = Number(yearText);
  const month = Number(monthText);

  if (!Number.isFinite(year) || !Number.isFinite(month)) return "";

  const startYear = month >= 7 ? year : year - 1;
  const endYearShort = String((startYear + 1) % 100).padStart(2, "0");
  return `${startYear}/${endYearShort}`;
}

function extractSeasonFromNotes(notes, dueDate) {
  const text = String(notes || "");
  const match = text.match(/Season:\s*([0-9]{4}\/[0-9]{2,4})/i);
  if (match?.[1]) return match[1];
  return inferFootballSeasonFromDate(dueDate);
}

function getCommissionScheduleItems(data) {
  const directItems = (Array.isArray(currentContractInstalments)
    ? currentContractInstalments
    : [])
    .filter((item) => {
      const status = String(item?.invoice_status || "").toLowerCase();
      return status !== "cancelled" && Boolean(normaliseScheduleDate(item?.due_date));
    })
    .map((item, index) => ({
      instalment_number: item.instalment_number || index + 1,
      fee_side: item.fee_side || "",
      amount: item.amount ?? null,
      currency: item.currency || data?.commission_currency || data?.salary_currency || "GBP",
      due_date: normaliseScheduleDate(item.due_date),
      payer: item.payer || data?.commission_payer || "",
      notes: item.notes || item.condition_notes || "",
      season_label: extractSeasonFromNotes(item.notes || item.condition_notes, item.due_date),
      instalment_percentage: null,
      source: "commission_instalments"
    }));

  if (directItems.length) {
    return directItems;
  }

  const analysis = parseAnalysisJson(data);
  const obligations = Array.isArray(analysis?.payment_obligations)
    ? analysis.payment_obligations
    : [];

  return obligations
    .filter((item) => {
      const type = String(item?.obligation_type || "").trim().toLowerCase();
      return type === "agency_commission" && Boolean(normaliseScheduleDate(item?.due_date));
    })
    .map((item, index) => ({
      instalment_number: index + 1,
      fee_side: item.fee_side || "",
      amount: item.amount ?? null,
      currency: item.currency || data?.commission_currency || data?.salary_currency || "GBP",
      due_date: normaliseScheduleDate(item.due_date),
      payer: item.payer || data?.commission_payer || "",
      notes: [
        item.season_label ? `Season: ${item.season_label}` : null,
        item.instalment_percentage != null ? `Instalment: ${item.instalment_percentage}%` : null,
        item.calculation_basis ? `Basis: ${item.calculation_basis}` : null,
        item.vat_treatment ? `VAT: ${item.vat_treatment}` : null,
        item.source_clause ? `Clause: ${item.source_clause}` : null,
        item.payment_protection ? `Protection: ${item.payment_protection}` : null
      ].filter(Boolean).join(" | "),
      season_label: item.season_label || inferFootballSeasonFromDate(item.due_date),
      instalment_percentage: item.instalment_percentage ?? null,
      source: "analysis_json"
    }));
}

function getCommissionScheduleSummary(data) {
  const items = getCommissionScheduleItems(data);

  if (!items.length) {
    return {
      frequency: safeValue(data.commission_frequency),
      instalments: safeValue(data.commission_instalments),
      items: []
    };
  }

  const datesBySeason = new Map();

  for (const item of items) {
    const season = item.season_label || inferFootballSeasonFromDate(item.due_date) || "__all__";
    const dueDate = normaliseScheduleDate(item.due_date);
    if (!dueDate) continue;

    if (!datesBySeason.has(season)) {
      datesBySeason.set(season, new Set());
    }

    // IMPORTANT: player-side + club-side on the same contractual date
    // count as one payment event/date, not two instalments.
    datesBySeason.get(season).add(dueDate);
  }

  const counts = Array.from(datesBySeason.values())
    .map((dateSet) => dateSet.size)
    .filter((count) => count > 0);

  const instalmentsPerSeason = counts.length
    ? Math.max(...counts)
    : null;

  let frequency = safeValue(data.commission_frequency);

  if (instalmentsPerSeason === 1) {
    frequency = t("oncePerSeason");
  } else if (instalmentsPerSeason === 2) {
    frequency = t("twicePerSeason");
  } else if (instalmentsPerSeason && instalmentsPerSeason > 2) {
    frequency = t("instalmentsPerSeason").replace("{count}", instalmentsPerSeason);
  }

  return {
    frequency,
    instalments:
      instalmentsPerSeason !== null
        ? String(instalmentsPerSeason)
        : safeValue(data.commission_instalments),
    items
  };
}

function renderCommissionScheduleFromDatabase(data) {
  const schedule = getCommissionScheduleSummary(data);
  if (!schedule.items.length) return "";

  // Collapse dual-representation duplicates into one row per season/date
  // while retaining the fee-side information.
  const grouped = new Map();

  schedule.items.forEach((item) => {
    const season = item.season_label || inferFootballSeasonFromDate(item.due_date) || t("na");
    const date = normaliseScheduleDate(item.due_date);
    if (!date) return;

    const key = `${season}|${date}`;

    if (!grouped.has(key)) {
      grouped.set(key, {
        season,
        due_date: date,
        percentages: new Set(),
        feeSides: new Set(),
        payer: item.payer || "",
        notes: []
      });
    }

    const row = grouped.get(key);

    if (item.instalment_percentage != null) {
      row.percentages.add(`${item.instalment_percentage}%`);
    }

    if (item.fee_side) {
      row.feeSides.add(item.fee_side);
    }

    if (item.notes) {
      row.notes.push(item.notes);
    }
  });

  const rows = Array.from(grouped.values())
    .sort((a, b) => String(a.due_date).localeCompare(String(b.due_date)))
    .map((row, index) => `
      <tr>
        <td>${index + 1}</td>
        <td>${safeValue(row.season)}</td>
        <td>${row.percentages.size ? Array.from(row.percentages).join(" / ") : t("na")}</td>
        <td><strong>${safeValue(row.due_date)}</strong></td>
        <td>${row.feeSides.size ? Array.from(row.feeSides).join(" / ") : t("na")}</td>
        <td>${safeValue(row.payer)}</td>
      </tr>
    `)
    .join("");

  return `
    <div style="margin-top:18px;">
      <div class="section-kicker">${t("paymentScheduleTitle")}</div>
      <div class="audit-schedule">
        <table>
          <thead>
            <tr>
              <th>${t("instalmentNumber")}</th>
              <th>${t("contractualSchedule")}</th>
              <th>%</th>
              <th>${t("dueDate")}</th>
              <th>${t("feeSide")}</th>
              <th>${t("payerLabel")}</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function getInstalmentMetrics(data) {
  const items = currentContractInstalments.filter((item) => {
    const status = String(item.invoice_status || "").toLowerCase();
    return status !== "cancelled";
  });

  if (!items.length) return null;

  const reportingYear = new Date().getFullYear();
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const currency =
    items.find((item) => item.currency)?.currency ||
    getCurrencyCode(data);

  const lifetimeRevenue = items.reduce(
    (sum, item) => sum + (toNumber(item.amount) || 0),
    0
  );

  const annualRevenue = items.reduce((sum, item) => {
    if (!item.due_date) return sum;

    const dueDate = new Date(`${item.due_date}T00:00:00`);
    if (Number.isNaN(dueDate.getTime())) return sum;

    return dueDate.getFullYear() === reportingYear
      ? sum + (toNumber(item.amount) || 0)
      : sum;
  }, 0);

  const futureItems = items
    .filter((item) => {
      if (!item.due_date) return false;

      const status = String(item.invoice_status || "").toLowerCase();
      if (status === "paid") return false;

      const dueDate = new Date(`${item.due_date}T00:00:00`);
      return !Number.isNaN(dueDate.getTime()) && dueDate >= today;
    })
    .sort((a, b) => String(a.due_date).localeCompare(String(b.due_date)));

  const nextDueDate = futureItems[0]?.due_date || null;

  const nextInvoiceAmount = nextDueDate
    ? futureItems
        .filter((item) => item.due_date === nextDueDate)
        .reduce(
          (sum, item) => sum + (toNumber(item.amount) || 0),
          0
        )
    : 0;

  return {
    currency,
    annualRevenue,
    lifetimeRevenue,
    nextInvoiceAmount,
    nextDueDate,
    items
  };
}

        </div>
      </section>
    `;
  }

  const annualSalary =
    calculateAnnualSalary(
      data.salary,
      data.salary_frequency
    );

  const method = normaliseCommissionMethod(data);
  const commissionRate = toNumber(
    data.commission_percentage ??
    (method === "percentage" ? data.commission_value : null)
  );
  const fixedAmount = toNumber(
    data.fixed_commission_amount ??
    (method === "fixed" ? data.commission_value : null)
  );

  const contractYears =
    calculateContractYears(
      data.playing_contract_start_date || data.start_date,
      data.playing_contract_end_date || data.end_date
    );

  const isDual = Boolean(data.is_dual_representation);
  const currency = getCurrencyCode(data);
  const basis = getCommissionBasis(data, annualSalary);

  const percentageMultiplier =
    isDual && data.dual_representation_multiplier == null
      ? 2
      : Math.max(
          1,
          toNumber(data.dual_representation_multiplier) || 1
        );

  const fixedMultiplier =
    isDual && Boolean(data.fixed_commission_per_side)
      ? 2
      : 1;

  const recurringPercentage =
    commissionRate !== null
      ? basis.recurring *
        (commissionRate / 100) *
        percentageMultiplier
      : 0;

  const oneOffPercentage =
    commissionRate !== null
      ? basis.oneOff *
        (commissionRate / 100) *
        percentageMultiplier
      : 0;

  const fixedCommission =
    fixedAmount !== null
      ? fixedAmount * fixedMultiplier
      : 0;

  /*
   * IMPORTANT:
   * A fixed commission amount is a total contractual amount unless a
   * recorded instalment schedule tells us when the revenue falls due.
   * Never present the whole fixed fee as "annual revenue".
   */
  if (
    method === "fixed" &&
    fixedAmount !== null &&
    !instalmentMetrics
  ) {
    const termText =
      contractYears !== null
        ? t("overContractTerm").replace("{years}", contractYears)
        : t("na");

    return `
      <section class="premium-card commercial-value-card">
        <div class="section-head">
          <div>
            <div class="section-kicker">06</div>
            <h2 class="section-title">
              ${t("sectionCommercialValue")}
            </h2>
          </div>
        </div>

        <p class="muted">
          ${t("commercialValueSubtitle")}
        </p>

        <div class="commercial-value-headline">
          <span class="commercial-value-label">
            ${t("expectedAnnualRevenue")}
          </span>

          <div class="commercial-value-annual">
            ${t("na")}
          </div>

          <div class="commercial-value-period">
            ${new Date().getFullYear()}
          </div>
        </div>

        <div class="commercial-total-box">
          <span class="commercial-value-label">
            ${t("expectedContractRevenue")}
          </span>

          <div class="commercial-total-value">
            ${formatMoneyValue(
              fixedCommission,
              currency
            )}
          </div>

          <div class="commercial-value-period">
            ${termText}
          </div>
        </div>

        <div class="commercial-calculation">
          <h4>${t("commercialCalculation")}</h4>

          <div class="commercial-calculation-grid">
            <div>
              <span>${t("representationType")}</span>
              <strong>
                ${isDual
                  ? t("dualRepresentationValue")
                  : t("singleRepresentationValue")}
              </strong>
            </div>

            <div>
              <span>${t("labelCommissionType")}</span>
              <strong>${safeValue(data.commission_method || data.commission_type)}</strong>
            </div>

            <div>
              <span>${t("expectedAnnualRevenue")}</span>
              <strong>${t("na")}</strong>
            </div>

            <div>
              <span>${t("expectedContractRevenue")}</span>
              <strong>
                ${formatMoneyValue(
                  fixedCommission,
                  currency
                )}
              </strong>
            </div>
          </div>

          <p class="commercial-note">
            ${t("fixedScheduleRequired")}
          </p>
        </div>
      </section>
    `;
  }

  let totalAnnualRevenue = null;
  let totalContractRevenue = null;

  if (
    method === "percentage" &&
    commissionRate !== null &&
    contractYears !== null
  ) {
    totalAnnualRevenue =
      recurringPercentage + oneOffPercentage;

    totalContractRevenue =
      recurringPercentage * contractYears +
      oneOffPercentage;
  } else if (
    method === "mixed" &&
    commissionRate !== null &&
    fixedAmount !== null &&
    contractYears !== null
  ) {
    totalAnnualRevenue =
      recurringPercentage +
      oneOffPercentage +
      fixedCommission;

    totalContractRevenue =
      recurringPercentage * contractYears +
      oneOffPercentage +
      fixedCommission;
  }

  if (
    totalAnnualRevenue === null ||
    totalContractRevenue === null
  ) {
    return `
      <section class="premium-card commercial-value-card">
        <div class="section-head">
          <div>
            <div class="section-kicker">06</div>
            <h2 class="section-title">
              ${t("sectionCommercialValue")}
            </h2>
          </div>
        </div>

        <div class="commercial-warning">
          ${t("commercialValueUnavailable")}
        </div>
      </section>
    `;
  }

  const termText =
    contractYears !== null
      ? t("overContractTerm").replace("{years}", contractYears)
      : t("na");

  return `
    <section class="premium-card commercial-value-card">
      <div class="section-head">
        <div>
          <div class="section-kicker">06</div>
          <h2 class="section-title">
            ${t("sectionCommercialValue")}
          </h2>
        </div>
      </div>

      <p class="muted">
        ${t("commercialValueSubtitle")}
      </p>

      <div class="commercial-value-headline">
        <span class="commercial-value-label">
          ${t("expectedAnnualRevenue")}
        </span>

        <div class="commercial-value-annual">
          ${formatMoneyValue(
            totalAnnualRevenue,
            currency
          )}
        </div>

        <div class="commercial-value-period">
          ${t("perYear")}
        </div>
      </div>

      <div class="commercial-total-box">
        <span class="commercial-value-label">
          ${t("expectedContractRevenue")}
        </span>

        <div class="commercial-total-value">
          ${formatMoneyValue(
            totalContractRevenue,
            currency
          )}
        </div>

        <div class="commercial-value-period">
          ${termText}
        </div>
      </div>

      <div class="commercial-calculation">
        <h4>${t("commercialCalculation")}</h4>

        <div class="commercial-calculation-grid">
          <div>
            <span>${t("calculationMethod")}</span>
            <strong>${getCommissionMethodDisplay(method)}</strong>
          </div>
          <div>
            <span>${t("salaryInput")}</span>
            <strong>${formatMoneyValue(data.salary, data.salary_currency || currency)} ${safeValue(data.salary_frequency)}</strong>
          </div>
          <div>
            <span>${t("annualisationRule")}</span>
            <strong>${getAnnualisationRule(data.salary_frequency).label}</strong>
          </div>
          <div>
            <span>${t("annualisedSalary")}</span>
            <strong>${formatMoneyValue(annualSalary, data.salary_currency || currency)}</strong>
          </div>
          <div>
            <span>${t("commissionBasisLabel")}</span>
            <strong>${getCommissionBasisDisplay(data)}</strong>
          </div>
          <div>
            <span>${t("commissionableOneOffs")}</span>
            <strong>${getCommissionableOneOffDisplay(data, currency)}</strong>
          </div>
          <div>
            <span>${t("annualSalaryBasis")}</span>
            <strong>${formatMoneyValue(basis.total, currency)}</strong>
          </div>
          <div>
            <span>${t("commissionRateLabel")}</span>
            <strong>${commissionRate !== null ? `${commissionRate}%` : t("na")}</strong>
          </div>
          <div>
            <span>${t("representationType")}</span>
            <strong>${isDual ? t("dualRepresentationValue") : t("singleRepresentationValue")}</strong>
          </div>
          <div>
            <span>${t("representationMultiplier")}</span>
            <strong>×${percentageMultiplier}</strong>
          </div>
          <div>
            <span>${t("contractTermLabel")}</span>
            <strong>${contractYears !== null ? `${contractYears} years` : t("na")}</strong>
          </div>
          <div>
            <span>${t("expectedAnnualRevenue")}</span>
            <strong>${formatMoneyValue(totalAnnualRevenue, currency)}</strong>
          </div>
          <div>
            <span>${t("expectedContractRevenue")}</span>
            <strong>${formatMoneyValue(totalContractRevenue, currency)}</strong>
          </div>
        </div>

        <div class="calculation-formula">
          <strong>${t("formulaLabel")}:</strong>
          ${method === "percentage"
            ? `${formatMoneyValue(basis.recurring, currency)} × ${commissionRate}% × ${percentageMultiplier}${basis.oneOff ? ` + one-off commission on ${formatMoneyValue(basis.oneOff, currency)}` : ""}`
            : `${formatMoneyValue(basis.recurring, currency)} × ${commissionRate}% × ${percentageMultiplier} + ${formatMoneyValue(fixedCommission, currency)} fixed`}
        </div>

        <p class="commercial-note">
          ${t("auditNote")}
        </p>
      </div>
    </section>
  `;
}

function formatDateValue(dateValue) {
  if (!dateValue) return t("invoiceDatePending");

  const localeMap = {
    en: "en-GB",
    fr: "fr-FR",
    es: "es-ES"
  };

  return new Intl.DateTimeFormat(
    localeMap[currentLang] || "en-GB",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  ).format(new Date(`${dateValue}T00:00:00`));
}

function renderInvoiceForecast(data) {
  const instalmentMetrics = getInstalmentMetrics(data);

  if (instalmentMetrics) {
    const futureGroups = new Map();
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    instalmentMetrics.items.forEach((item) => {
      if (!item.due_date) return;

      const status = String(item.invoice_status || "").toLowerCase();
      if (["paid", "cancelled"].includes(status)) return;

      const dueDate = new Date(`${item.due_date}T00:00:00`);
      if (Number.isNaN(dueDate.getTime()) || dueDate < today) return;

      const key = item.due_date;

      if (!futureGroups.has(key)) {
        futureGroups.set(key, {
          dueDate: item.due_date,
          amount: 0,
          currency:
            item.currency ||
            instalmentMetrics.currency,
          items: []
        });
      }

      const group = futureGroups.get(key);
      group.amount += toNumber(item.amount) || 0;
      group.items.push(item);
    });

    const groups = [...futureGroups.values()]
      .sort((a, b) => a.dueDate.localeCompare(b.dueDate));

    if (!groups.length) {
      return `
        <section class="premium-card invoice-forecast-card">
          <div class="section-head">
            <div>
              <div class="section-kicker">07</div>
              <h2 class="section-title">
                ${t("sectionInvoiceForecast")}
              </h2>
            </div>
          </div>

          <div class="commercial-warning">
            ${t("no")} ${t("invoiceStatusForecast")}
          </div>
        </section>
      `;
    }

    return `
      <section class="premium-card invoice-forecast-card">
        <div class="section-head">
          <div>
            <div class="section-kicker">07</div>
            <h2 class="section-title">
              ${t("sectionInvoiceForecast")}
            </h2>
          </div>
        </div>

        <p class="muted">
          ${t("invoiceForecastSubtitle")}
        </p>

        <div class="invoice-opportunities">
          ${groups.map((group, index) => {
            const sideNames = group.items
              .map((item) => item.fee_side)
              .filter(Boolean)
              .join(" + ");

            const payers = [
              ...new Set(
                group.items
                  .map((item) => item.payer)
                  .filter(Boolean)
              )
            ].join(" / ");

            return `
              <div class="invoice-opportunity">
                <div class="invoice-opportunity-head">
                  <div class="invoice-opportunity-title">
                    ${index === 0
                      ? t("sectionInvoiceForecast")
                      : t("forecast")}
                  </div>

                  <div class="invoice-status">
                    ${group.items
                      .map((item) => item.invoice_status)
                      .filter(Boolean)
                      .join(" / ") || t("invoiceStatusForecast")}
                  </div>
                </div>

                <div class="invoice-amount-box">
                  <span class="invoice-amount-label">
                    ${t("invoiceAmount")}
                  </span>

                  <div class="invoice-amount-value">
                    ${formatMoneyValue(
                      group.amount,
                      group.currency
                    )}
                  </div>
                </div>

                <div class="invoice-details-grid">
                  <div class="invoice-detail">
                    <span>${t("invoiceClient")}</span>
                    <strong>${safeValue(data.player_name)}</strong>
                  </div>

                  <div class="invoice-detail">
                    <span>${t("invoicePayer")}</span>
                    <strong>${payers || t("na")}</strong>
                  </div>

                  <div class="invoice-detail">
                    <span>${t("invoiceType")}</span>
                    <strong>${sideNames || t("annualCommissionInvoice")}</strong>
                  </div>

                  <div class="invoice-detail">
                    <span>${t("paymentDueDate")}</span>
                    <strong>${formatDateValue(group.dueDate)}</strong>
                  </div>

                  <div class="invoice-detail">
                    <span>${t("invoiceInstalments")}</span>
                    <strong>${group.items.length}</strong>
                  </div>

                  <div class="invoice-detail">
                    <span>${t("invoiceStatus")}</span>
                    <strong>
                      ${group.items.some((item) => item.conditional)
                        ? t("invoiceReviewRequired")
                        : t("invoiceStatusForecast")}
                    </strong>
                  </div>
                </div>
              </div>
            `;
          }).join("")}
        </div>

        <p class="invoice-forecast-note">
          ${t("invoiceForecastNote")}
        </p>
      </section>
    `;
  }

  const annualSalary =
    calculateAnnualSalary(
      data.salary,
      data.salary_frequency
    );

  const method = normaliseCommissionMethod(data);
  const commissionRate =
    toNumber(
      data.commission_percentage ??
      (method === "percentage"
        ? data.commission_value
        : null)
    );

  if (
    annualSalary === null ||
    commissionRate === null
  ) {
    return `
      <section class="premium-card invoice-forecast-card">
        <div class="section-head">
          <div>
            <div class="section-kicker">07</div>
            <h2 class="section-title">
              ${t("sectionInvoiceForecast")}
            </h2>
          </div>
        </div>

        <div class="commercial-warning">
          ${t("commercialValueUnavailable")}
        </div>
      </section>
    `;
  }

  const currency = getCurrencyCode(data);
  const basis = getCommissionBasis(data, annualSalary);

  const annualSideAmount =
    basis.total *
    (commissionRate / 100);

  const isDual =
    Boolean(data.is_dual_representation);

  const payer =
    data.commission_payer ||
    data.club_name ||
    null;

  return `
    <section class="premium-card invoice-forecast-card">
      <div class="section-head">
        <div>
          <div class="section-kicker">07</div>
          <h2 class="section-title">
            ${t("sectionInvoiceForecast")}

      </div>

      <p class="muted">
        ${t("invoiceForecastSubtitle")}
      </p>

      <div class="invoice-opportunities">
        ${renderInvoiceOpportunity({
          title: t("invoicePlayerSide"),
          amount: annualSideAmount,
          currency,
          client: data.player_name,
          payer,
          frequency: data.commission_frequency,
          instalments: data.commission_instalments
        })}

        ${
          isDual
            ? renderInvoiceOpportunity({
                title: t("invoiceClubSide"),
                amount: annualSideAmount,
                currency,
                client: data.club_name,
                payer: data.club_name || payer,
                frequency: data.commission_frequency,
                instalments: data.commission_instalments
              })
            : ""
        }
      </div>

      <p class="invoice-forecast-note">
        ${t("invoiceForecastNote")}
      </p>
    </section>
  `;
}

        container.innerHTML = `<div class="status-box">${t("errorSupabase")}</div>`;
        return;
      }

      const { data: { user }, error: userError } = await db.auth.getUser();

      if (userError || !user) {
        window.location.href = "/dealtrack-pro/login.html";
        return;
      }

      currentUser = user;
      currentAgency = await loadAgencyContext(db);
      renderIdentityBar();

      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          await db.auth.signOut();
          window.location.href = "/dealtrack-pro/login.html";
        });
      }

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      const addClauseBtn = document.getElementById("addClauseBtn");
      if (addClauseBtn && id) {
        addClauseBtn.href = `/dealtrack-pro/add-clause.html?contract_id=${id}`;
      }

      const editContractBtn = document.getElementById("editContractBtn");
      if (editContractBtn && id) {
        editContractBtn.href = `/dealtrack-pro/edit-contract.html?id=${id}`;
      }

      if (!id) {
        container.innerHTML = `<div class="status-box">${t("errorMissingId")}</div>`;
        return;
      }

      const { data, error } = await db
        .from("contracts")
        .select("*")
        .eq("id", id)
        .eq("user_id", user.id)
        .single();

      if (error || !data) {
        console.error("Load contract error:", error);
        container.innerHTML = `<div class="status-box">${t("errorNotFound")}</div>`;
        return;
      }

      currentContract = data;
      currentContractInstalments = [];

      const directInstalments = await db
        .from("commission_instalments")
        .select("*")
        .eq("contract_id", id)
        .order("due_date", { ascending: true })
        .order("instalment_number", { ascending: true });

      if (
        !directInstalments.error &&
        Array.isArray(directInstalments.data)
      ) {
        currentContractInstalments =
          directInstalments.data;
      }

      if (
        directInstalments.error ||
        currentContractInstalments.length === 0
      ) {
        const rpcResult = await db.rpc(
          "get_my_commission_instalments"
        );

        if (
          !rpcResult.error &&
          Array.isArray(rpcResult.data)
        ) {
          currentContractInstalments =
            rpcResult.data.filter(
              (item) =>
                String(item.contract_id) === String(id)
            );
        }
      }

      applyStaticTranslations();
      renderContract(data);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DealTrack Pro — Contract</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/agent-academy/js/supabase-client.js"></script>
  <script src="/agent-academy/js/auth.js"></script>
  <script src="/agent-academy/js/guard.js"></script>

  <style>
    :root {
      --bg: #020b1d;
      --bg-2: #07152f;
      --panel: rgba(10, 24, 52, 0.88);
      --panel-strong: rgba(12, 28, 58, 0.96);
      --panel-soft: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(212, 175, 55, 0.22);
      --text: #f6f8fc;
      --muted: #9fb0cf;
      --blue: #2f8cff;
      --blue-2: #58a6ff;
      --gold: #d4af37;
      --gold-2: #f0c85a;
      --danger: #ef4444;
      --shadow: 0 18px 60px rgba(0,0,0,0.36);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(47,140,255,0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(212,175,55,0.12), transparent 24%),
        linear-gradient(180deg, #010814 0%, #05122a 45%, #020b1d 100%);
      min-height: 100vh;
      padding: 24px;
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: grid;
      gap: 12px;
      padding: 14px 0 16px;
      margin-bottom: 24px;
      background: linear-gradient(
        180deg,
        rgba(2, 11, 29, 0.985),
        rgba(2, 11, 29, 0.93)
      );
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 12px 28px rgba(0,0,0,0.16);
    }

    .topbar-primary,
    .topbar-secondary,
    .topbar-brand-nav,
    .topbar-tools,
    .topbar-session-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .topbar-primary,
    .topbar-secondary {
      justify-content: space-between;
      gap: 14px;
    }

    .topbar-tools {
      flex-wrap: wrap;
    }

    .topbar-session-actions {
      justify-content: flex-end;
      margin-left: auto;
    }

    .identity-bar {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 285px;
      max-width: 390px;
      padding: 8px 10px 8px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
    }

    .identity-avatar {
      display: grid;
      place-items: center;
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #08111f;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      font-size: 0.78rem;
      font-weight: 950;
      letter-spacing: 0.02em;
    }

    .identity-copy {
      min-width: 0;
      line-height: 1.22;
    }

    .identity-label,
    .identity-name,
    .identity-agency,
    .identity-email {
      display: block;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .identity-label {
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .identity-name {
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 900;
    }

    .identity-agency {
      color: var(--gold-2);
      font-size: 0.72rem;
      font-weight: 800;
    }

    .identity-email {
      color: var(--muted);
      font-size: 0.69rem;
      font-weight: 650;
    }

    .topbar-logout {
      min-height: 38px;
      padding: 0 12px;
      white-space: nowrap;
    }

    .topbar .lang-switcher {
      flex-wrap: nowrap;
    }

    .topbar .lang-btn {
      min-width: 44px;
      min-height: 38px;
    }

    .brand {
  display: flex;
  flex-direction: column;
  margin-right: 12px;
}

.brand-title {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: #ffffff;
}

.brand-sub {
  font-size: 11px;
  color: var(--gold-2);
  opacity: 0.85;
  letter-spacing: 0.08em;
}

    .brand-title {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: -0.02em;
}

.brand-main {
  color: #ffffff;
}

.brand-pro {
  color: #d4af37;
  margin-left: 6px;
}

.brand-tagline {
  font-size: 11px;
  color: #bfa046;
  margin-top: 2px;
}
    .back-link,
    .btn,
    .lang-btn {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      transition: 0.2s ease;
    }

    .back-link,
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 16px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .back-link:hover,
    .btn:hover,
    .lang-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.16);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-2) 100%);
      border-color: rgba(88,166,255,0.35);
      color: white;
      box-shadow: 0 14px 30px rgba(47,140,255,0.22);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-2) 100%);
      color: #09111f;
      border-color: rgba(212,175,55,0.55);
      box-shadow: 0 14px 30px rgba(212,175,55,0.18);
    }

    .lang-switcher {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .lang-btn {
      min-width: 54px;
      min-height: 46px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 700;
      opacity: 0.86;
    }

    .lang-btn.is-active {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-2) 100%);
      border-color: rgba(88,166,255,0.35);
      color: #fff;
      opacity: 1;
      box-shadow: 0 10px 24px rgba(47,140,255,0.24);
    }

    .hero {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(47,140,255,0.12), transparent 42%),
        linear-gradient(160deg, rgba(212,175,55,0.08), transparent 55%),
        var(--panel-strong);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 30px 30px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 85% 20%, rgba(212,175,55,0.12), transparent 25%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold-2);
      margin-bottom: 14px;
      font-weight: 700;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 0;
      max-width: 820px;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.65;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.95rem;
    }

    .meta-pill strong {
      color: var(--gold-2);
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 0.95fr;
      gap: 22px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 22px;
    }

    .premium-card {
      background: linear-gradient(180deg, rgba(11,24,52,0.96), rgba(7,20,43,0.96));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .section-kicker {
      font-size: 0.84rem;
      color: var(--gold-2);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .data-tile {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 16px 16px 15px;
      min-height: 92px;
    }

    .tile-label {
      display: block;
      font-size: 0.8rem;
      line-height: 1.2;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .tile-value {
      font-size: 1rem;
      line-height: 1.45;
      color: var(--text);
      word-break: break-word;
      font-weight: 600;
    }

    .muted-line {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 650;
      line-height: 1.35;
    }

    .summary-card {
      padding: 0;
      overflow: hidden;
    }

    .summary-top {
      padding: 22px 22px 18px;
      border-bottom: 1px solid var(--border);
      background:
        linear-gradient(135deg, rgba(47,140,255,0.08), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    }

    .summary-top h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    .summary-top p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .summary-list {
      padding: 18px 22px 22px;
      display: grid;
      gap: 12px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .summary-row .left {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .summary-row .right {
      color: var(--text);
      font-weight: 700;
      text-align: right;
    }

    .commercial-value-card {
  position: relative;
  overflow: hidden;
  border-color: rgba(212, 175, 55, 0.34);
  background:
    radial-gradient(
      circle at top right,
      rgba(240, 200, 90, 0.13),
      transparent 34%
    ),
    linear-gradient(
      145deg,
      rgba(212, 175, 55, 0.09),
      rgba(8, 22, 48, 0.98) 48%
    );
}

.commercial-value-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 22px;
  right: 22px;
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--gold),
    transparent
  );
}

.commercial-value-headline {
  padding: 22px;
  margin-bottom: 16px;
  border: 1px solid rgba(212, 175, 55, 0.2);
  border-radius: 20px;
  background: rgba(212, 175, 55, 0.055);
  text-align: center;
}

.commercial-value-label {
  display: block;
  margin-bottom: 9px;
  color: var(--muted);
  font-size: 0.77rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.commercial-value-annual {
  color: var(--gold-2);
  font-size: clamp(2rem, 5vw, 3.2rem);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.045em;
}

.commercial-value-period {
  margin-top: 9px;
  color: var(--muted);
  font-size: 0.9rem;
}

.commercial-total-box {
  padding: 20px;
  margin-bottom: 16px;
  border: 1px solid rgba(88, 166, 255, 0.17);
  border-radius: 18px;
  background: rgba(47, 140, 255, 0.055);
  text-align: center;
}

.commercial-total-value {
  margin-top: 7px;
  color: var(--text);
  font-size: clamp(1.55rem, 4vw, 2.25rem);
  font-weight: 900;
  letter-spacing: -0.035em;
}

.commercial-breakdown {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.commission-side-box {
  padding: 16px;
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 17px;
  background: rgba(255, 255, 255, 0.025);
}

.commission-side-title {
  margin-bottom: 12px;
  color: var(--gold-2);
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.commission-side-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.055);
}

.commission-side-row:last-child {
  border-bottom: 0;
}

.commission-side-row span {
  color: var(--muted);
  font-size: 0.84rem;
}

.commission-side-row strong {
  color: var(--text);
  text-align: right;
}

.commercial-calculation {
  margin-top: 16px;
  padding: 15px;
  border-radius: 16px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.025);
  font-size: 0.88rem;
  line-height: 1.65;
}

    .commercial-calculation h4 {
  margin: 0 0 16px;
  color: var(--gold-2);
  font-size: 0.9rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.commercial-calculation-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.commercial-calculation-grid > div {
  padding: 14px;
  border: 1px solid rgba(255, 255, 255, 0.065);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.025);
}

.commercial-calculation-grid span {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.commercial-calculation-grid strong {
  color: var(--text);
  font-size: 1rem;
  line-height: 1.4;
}

.commercial-note {
  margin: 16px 0 0;
  color: var(--muted);
  font-size: 0.84rem;
  line-height: 1.6;
}



    .calculation-formula {
      margin-top: 14px;
      padding: 14px 16px;
      border: 1px solid rgba(88,166,255,0.18);
      border-radius: 14px;
      background: rgba(47,140,255,0.055);
      color: var(--text);
      line-height: 1.55;
      font-size: 0.92rem;
      word-break: break-word;
    }

    .calculation-formula strong {
      color: var(--gold-2);
    }

    .audit-schedule {
      margin-top: 16px;
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 15px;
    }

    .audit-schedule table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    .audit-schedule th,
    .audit-schedule td {
      padding: 11px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      text-align: left;
      vertical-align: top;
      font-size: 0.84rem;
    }

    .audit-schedule th {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.025);
    }

    .audit-schedule tr:last-child td { border-bottom: 0; }

    /* Compact spreadsheet-style schedules */
    .schedule-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0 10px;
      flex-wrap: wrap;
    }

    .schedule-count {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .schedule-toggle {
      appearance: none;
      border: 1px solid rgba(88,166,255,0.22);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--text);
      background: rgba(47,140,255,0.07);
      cursor: pointer;
      font-weight: 800;
      font-size: 0.78rem;
    }

    .schedule-row-hidden { display: none; }

    /* Floating payment-details popover: keeps the compact schedule from expanding vertically. */
    .schedule-popover {
      position: fixed;
      z-index: 9999;
      width: min(440px, calc(100vw - 24px));
      max-height: min(430px, calc(100vh - 24px));
      overflow: auto;
      padding: 0;
      border: 1px solid rgba(88,166,255,0.30);
      border-radius: 14px;
      background: rgba(10,25,49,0.98);
      box-shadow: 0 18px 52px rgba(0,0,0,0.42);
      color: var(--text);
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px);
      transition: opacity .14s ease, transform .14s ease, visibility .14s ease;
      backdrop-filter: blur(14px);
    }

    .schedule-popover.is-open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .schedule-popover-header {
      position: sticky;
      top: 0;
      padding: 13px 15px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(15,34,63,0.98);
      color: var(--gold-2);
      font-size: .82rem;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .schedule-popover-body {
      padding: 13px 15px 15px;
      display: grid;
      gap: 10px;
    }

    .schedule-popover-field {
      display: grid;
      grid-template-columns: 125px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding-bottom: 9px;
      border-bottom: 1px solid rgba(255,255,255,0.055);
    }

    .schedule-popover-field:last-child { border-bottom: 0; padding-bottom: 0; }
    .schedule-popover-label {
      color: var(--muted);
      font-size: .70rem;
      font-weight: 900;
      letter-spacing: .045em;
      text-transform: uppercase;
    }
    .schedule-popover-value {
      color: var(--text);
      font-size: .82rem;
      line-height: 1.48;
      overflow-wrap: anywhere;
    }

    .details-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 9px;
      padding: 6px 9px;
      background: rgba(255,255,255,0.035);
      color: var(--text);
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .trigger-cell { min-width: 190px; white-space: normal !important; }
    .trigger-badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.70rem;
      font-weight: 900;
      letter-spacing: 0.03em;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
      color: var(--text);
    }
    .trigger-badge.pending { color: #ffe0a3; border-color: rgba(245,158,11,.30); background: rgba(245,158,11,.09); }
    .trigger-badge.met { color: #b9f6d0; border-color: rgba(34,197,94,.30); background: rgba(34,197,94,.09); }
    .trigger-badge.failed { color: #ffc7c7; border-color: rgba(239,68,68,.30); background: rgba(239,68,68,.09); }
    .trigger-actions { display:flex; gap:6px; margin-top:7px; flex-wrap:wrap; }
    .trigger-btn {
      appearance:none;
      border:1px solid rgba(88,166,255,.22);
      border-radius:8px;
      padding:5px 8px;
      background:rgba(47,140,255,.07);
      color:var(--text);
      cursor:pointer;
      font-size:.69rem;
      font-weight:850;
    }
    .trigger-btn.confirm { border-color:rgba(34,197,94,.28); background:rgba(34,197,94,.08); }
    .trigger-btn:disabled { opacity:.45; cursor:not-allowed; }
    .trigger-date-editor { display:flex; gap:6px; align-items:center; margin-top:7px; flex-wrap:wrap; }
    .trigger-date-editor[hidden] { display:none; }
    .trigger-date-editor input[type="date"] {
      min-height:32px;
      padding:4px 7px;
      border:1px solid rgba(255,255,255,.16);
      border-radius:8px;
      color:var(--text);
      background:rgba(255,255,255,.06);
      color-scheme:dark;
    }

    .amount-known { color: var(--gold-2); font-weight: 900; }
    .amount-estimated::after {
      content: " *";

.invoice-forecast-card {

.invoice-opportunities {

}

.invoice-opportunity {
  padding: 18px;

  background: rgba(255, 255, 255, 0.025);
}

.invoice-opportunity-head {
  display: flex;
  align-items: flex-start;

}

.invoice-opportunity-title {

}

.invoice-status {
  display: inline-flex;

  min-height: 30px;
  padding: 0 10px;
  border: 1px solid rgba(245, 158, 11, 0.26);
  border-radius: 999px;
  color: #ffe0a3;
  background: rgba(245, 158, 11, 0.09);
  font-size: 0.75rem;
  font-weight: 800;
}

.invoice-amount-box {
  padding: 18px;
  margin-bottom: 14px;
  border: 1px solid rgba(212, 175, 55, 0.2);
  border-radius: 16px;
  background: rgba(212, 175, 55, 0.055);
}

.invoice-amount-label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 0.77rem;
  font-weight: 800;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.invoice-amount-value {
  color: var(--gold-2);
  font-size: clamp(2.4rem, 6vw, 3.8rem);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.04em;
}

.invoice-details-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.invoice-detail {
  padding: 13px;
  border: 1px solid rgba(255, 255, 255, 0.055);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.02);
}

.invoice-detail span {
  display: block;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 0.73rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.invoice-detail strong {
  color: var(--text);
  font-size: 0.94rem;
  line-height: 1.45;
}

.invoice-forecast-note {
  margin: 16px 0 0;
  padding: 14px;
  border-radius: 14px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.02);
  font-size: 0.84rem;
  line-height: 1.6;
}

  <script>
    const I18N = JSON.parse(document.getElementById("dealtrack-contract-i18n").textContent);
    let currentLang = localStorage.getItem("lang") || "en";
    let currentContract = null;
    let currentContractInstalments = [];
    let currentDb = null;
    let currentUser = null;
    let currentAgency = null;

    function t(key) {
      return I18N[currentLang]?.[key] || I18N.en?.[key] || key;
    }

    function getUserDisplayName(user) {
      const metadata = user?.user_metadata || {};
      const fullName =
        metadata.full_name ||
        metadata.name ||
        [metadata.first_name, metadata.last_name].filter(Boolean).join(" ");

      return String(fullName || user?.email?.split("@")[0] || "User")
        .trim()
        .replace(/[._-]+/g, " ")
        .replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    async function loadAgencyContext(db) {
      const { data, error } = await db.rpc("get_my_agency_context");

      if (error) {
        console.warn("Agency context could not be loaded:", error);
        return null;
      }

      const context = Array.isArray(data) ? data[0] : data;
      return context?.agency_id ? context : null;
    }

    function renderIdentityBar() {
      const name = getUserDisplayName(currentUser);
      const agencyName =
        currentAgency?.legal_name ||
        currentAgency?.name ||
        t("noAgencyAssigned");

      document.getElementById("identityName").textContent = name;
      document.getElementById("identityAgency").textContent = agencyName;
      document.getElementById("identityEmail").textContent =
        currentUser?.email || "—";

      const initials = name
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map((part) => part.charAt(0).toUpperCase())
        .join("");

      document.getElementById("identityInitials").textContent =
        initials || "U";
    }

    function applyStaticTranslations() {
      document.documentElement.lang = currentLang;

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        el.textContent = t(key);
      });

      document.querySelectorAll("[data-lang-btn]").forEach((btn) => {
        btn.classList.toggle("is-active", btn.getAttribute("data-lang-btn") === currentLang);
      });

      document.title = "DealTrack Pro — " + (currentContract?.player_name || t("sectionContract"));
    }

    function safeValue(value) {
      return value || `<span class="empty">${t("na")}</span>`;
    }

    function yesNo(value) {
      return value ? t("yes") : t("no");
    }

    function moneyLine(amount, currency, frequency) {
      const a = amount ?? null;
      const c = currency || "";
      const f = frequency || "";
      if (a === null || a === "" || typeof a === "undefined") return t("na");
      return `${a} ${c}${f ? ` · ${f}` : ""}`.trim();
    }
function toNumber(value) {
  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return null;
  }

  if (typeof value === "number") {
    return Number.isFinite(value)
      ? value
      : null;
  }

  const cleaned = String(value)
    .replace(/\s/g, "")
    .replace(/,/g, "")
    .replace(/[^\d.-]/g, "");

  if (!cleaned) {
    return null;
  }

  const number = Number(cleaned);

  return Number.isFinite(number)
    ? number
    : null;
}

function normaliseFrequency(value) {
  return String(value || "")
    .trim()
    .toLowerCase();
}

function calculateAnnualSalary(
  salaryAmount,
  salaryFrequency
) {
  const salary =
    toNumber(salaryAmount);

  if (salary === null) {
    return null;
  }

  const frequency =
    normaliseFrequency(salaryFrequency);

  // Contracts may state a non-standard number of salary payments per year,
  // for example "Monthly, paid 14 times per contractual year".
  const explicitPaymentCount = frequency.match(
    /(\d+(?:\.\d+)?)\s*(?:times|payments|instalments|installments|fois|versements|veces|pagos)/i
  );

  if (explicitPaymentCount) {
    const multiplier = Number(explicitPaymentCount[1]);
    if (Number.isFinite(multiplier) && multiplier > 0) {
      return salary * multiplier;
    }
  }

  const frequencyMultipliers = {
    weekly: 52,
    week: 52,
    hebdomadaire: 52,
    semanal: 52,

    monthly: 12,
    month: 12,
    mensuel: 12,
    mensuelle: 12,
    mensual: 12,

    fortnightly: 26,
    biweekly: 26,
    quinzaine: 26,
    quincenal: 26,

    yearly: 1,
    annual: 1,
    annually: 1,
    year: 1,
    annuel: 1,
    annuelle: 1,
    anual: 1
  };

  const multiplier =
    frequencyMultipliers[frequency];

  if (!multiplier) {
    return null;
  }

  return salary * multiplier;
}

function calculateContractYears(
  startDateValue,
  endDateValue
) {
  if (!startDateValue || !endDateValue) {
    return null;
  }

  const startDate =
    new Date(`${startDateValue}T00:00:00`);

  const endDate =
    new Date(`${endDateValue}T00:00:00`);

  if (
    Number.isNaN(startDate.getTime()) ||
    Number.isNaN(endDate.getTime()) ||
    endDate <= startDate
  ) {
    return null;
  }

  const millisecondsPerYear =
    365.2425 * 24 * 60 * 60 * 1000;

  const exactYears =
    (endDate - startDate) /
    millisecondsPerYear;

  return Math.max(
    1,
    Math.round(exactYears)
  );
}

function getCurrencyCode(data) {
  return (
    data.commission_currency ||
    data.salary_currency ||
    currentContractInstalments[0]?.currency ||
    "GBP"
  );
}

function formatMoneyValue(
  amount,
  currency
) {
  const numericAmount =
    toNumber(amount);

  if (numericAmount === null) {
    return t("na");
  }

  const localeMap = {
    en: "en-GB",
    fr: "fr-FR",
    es: "es-ES"
  };

  try {
    return new Intl.NumberFormat(
      localeMap[currentLang] || "en-GB",
      {
        style: "currency",
        currency: currency || "GBP",
        maximumFractionDigits: 0
      }
    ).format(numericAmount);
  } catch {
    return `${numericAmount.toLocaleString()} ${
      currency || ""
    }`.trim();
  }
}

function renderCommissionSideBox({
  title,
  rate,
  annualRevenue,
  contractRevenue,
  currency
}) {
  return `
    <div class="commission-side-box">
      <div class="commission-side-title">
        ${title}
      </div>

      <div class="commission-side-row">
        <span>${t("commissionRate")}</span>
        <strong>${rate}%</strong>
      </div>

      <div class="commission-side-row">
        <span>${t("annualRevenue")}</span>
        <strong>
          ${formatMoneyValue(
            annualRevenue,
            currency
          )}
        </strong>
      </div>

      <div class="commission-side-row">
        <span>${t("contractRevenue")}</span>
        <strong>
          ${formatMoneyValue(
            contractRevenue,
            currency
          )}
        </strong>
      </div>
    </div>
  `;
}

function normaliseCommissionMethod(data) {
  const explicit = String(
    data.commission_method ||
    data.commission_type ||
    ""
  ).trim().toLowerCase();

  const mentionsPercentage =
    explicit === "percentage" ||
    explicit.includes("percentage") ||
    explicit.includes("%");

  const mentionsFixed =
    explicit === "fixed" ||
    explicit.includes("fixed");

  if (
    explicit === "mixed" ||
    explicit.includes("mixed") ||
    (mentionsFixed && mentionsPercentage)
  ) return "mixed";

  if (mentionsPercentage) return "percentage";

  if (mentionsFixed) return "fixed";

  if (
    toNumber(data.commission_percentage) !== null &&
    toNumber(data.fixed_commission_amount) !== null
  ) return "mixed";

  if (toNumber(data.fixed_commission_amount) !== null) return "fixed";
  if (toNumber(data.commission_percentage) !== null) return "percentage";

  return "unknown";
}

function getCommissionStructureComponents(data) {
  const analysis = parseContractAnalysis(data) || {};
  const method = normaliseCommissionMethod(data);
  const defaultCurrency =
    data?.commission_currency ||
    analysis?.commission_currency ||
    data?.salary_currency ||
    "EUR";

  const recordedComponents = Array.isArray(analysis?.commission_components)
    ? analysis.commission_components.filter((item) => item && typeof item === "object")
    : [];

  if (recordedComponents.length) {
    const components = recordedComponents.map((item, index) => ({
      component_reference: item.component_reference || `component-${index + 1}`,
      component_type: item.component_type || "other",
      fee_side: item.fee_side || null,
      classification_method: item.classification_method || "review_required",
      payer: item.payer || null,
      recipient: item.recipient || null,
      fixed_amount: resolverNumber(item.fixed_amount),
      percentage_rate: resolverNumber(item.percentage_rate),
      calculation_basis: item.calculation_basis || null,
      currency: item.currency || defaultCurrency,
      applicable_period: item.applicable_period || null,
      evidence: item.evidence || null
    }));

    // Cross-check component values against the independently extracted summary
    // fields. This prevents a percentage rate such as 10 from being rendered as
    // a EUR 10 fixed fee while preserving multi-component structures for review.
    const fixedComponents = components.filter((item) => item.component_type === "fixed");
    const percentageComponents = components.filter((item) => item.component_type === "percentage");
    const confirmedFixedTotal =
      resolverNumber(data?.fixed_commission_amount) ??
      (["fixed", "mixed"].includes(method)
        ? resolverNumber(data?.commission_value)
        : null) ??
      resolverNumber(analysis?.club_services_fee);
    const confirmedPercentageRate =
      resolverNumber(data?.commission_percentage) ??
      resolverNumber(analysis?.commission_percentage);

    if (fixedComponents.length === 1 && confirmedFixedTotal !== null) {
      fixedComponents[0].fixed_amount = confirmedFixedTotal;
      fixedComponents[0].percentage_rate = null;
    }
    if (percentageComponents.length === 1 && confirmedPercentageRate !== null) {
      percentageComponents[0].percentage_rate = confirmedPercentageRate;
      percentageComponents[0].fixed_amount = null;
    }

    return components;
  }

  const fixedAmount =
    resolverNumber(data?.fixed_commission_amount) ??
    (["fixed", "mixed"].includes(method)
      ? resolverNumber(data?.commission_value)
      : null) ??
    resolverNumber(analysis?.club_services_fee);

  const percentageRate =
    resolverNumber(data?.commission_percentage) ??
    resolverNumber(analysis?.commission_percentage) ??
    (["percentage", "mixed"].includes(method) && fixedAmount === null
      ? resolverNumber(data?.commission_value)
      : null);

  const legacyComponents = [];
  if (fixedAmount !== null) {
    legacyComponents.push({
      component_reference: "fixed-fee",
      component_type: "fixed",
      fee_side: analysis?.club_services_fee !== null && analysis?.club_services_fee !== undefined
        ? "club-side"
        : null,
      classification_method: "review_required",
      payer: data?.commission_payer || null,
      fixed_amount: fixedAmount,
      percentage_rate: null,
      calculation_basis: null,
      currency: defaultCurrency,
      applicable_period: null,
      evidence: null
    });
  }
  if (percentageRate !== null) {
    legacyComponents.push({
      component_reference: "percentage-fee",
      component_type: "percentage",
      fee_side: null,
      classification_method: "review_required",
      payer: null,
      fixed_amount: null,
      percentage_rate: percentageRate,
      calculation_basis: analysis?.commission_basis || data?.commission_basis || "basic salary",
      currency: defaultCurrency,
      applicable_period: null,
      evidence: null
    });
  }
  return legacyComponents;
}

function renderCommissionComponentTiles(data) {
  const components = getCommissionStructureComponents(data);
  if (!components.length) {
    return `<div class="data-tile"><span class="tile-label">${t("labelCommissionValue")}</span><div class="tile-value">${t("na")}</div></div>`;
  }

  const analysis = parseContractAnalysis(data) || {};
  const annualSalary = calculateAnnualSalary(
    data?.salary ?? data?.gross_salary ?? analysis?.gross_salary,
    data?.salary_frequency ?? analysis?.salary_frequency
  );

  const typeLabels = {
    fixed: t("labelFixedCommissionAmount"),
    percentage: t("labelPercentageCommissionRate"),
    formula: t("labelCommissionType"),
    bonus: t("labelCommissionType"),
    collaboration: t("labelCommissionType"),
    other: t("labelCommissionValue")
  };

  return components.map((item, index) => {
    const label = typeLabels[item.component_type] || t("labelCommissionValue");
    const side = item.fee_side ? ` · ${safeValue(item.fee_side)}` : "";
    const payer = item.payer ? `<div class="muted-line">${t("payerLabel")}: ${safeValue(item.payer)}</div>` : "";
    const basis = item.calculation_basis ? `<div class="muted-line">${safeValue(item.calculation_basis)}</div>` : "";
    let primaryValue = t("na");
    let estimate = "";

    if (item.component_type === "fixed" && item.fixed_amount !== null) {
      primaryValue = formatMoneyValue(item.fixed_amount, item.currency);
    } else if (item.component_type === "percentage" && item.percentage_rate !== null) {
      primaryValue = `${item.percentage_rate}%`;
      if (annualSalary !== null) {
        estimate = `<div class="muted-line">${t("labelEstimatedAnnualPercentage")}: ${formatMoneyValue(annualSalary * (item.percentage_rate / 100), item.currency)}</div>`;
      }
    } else if (item.calculation_basis) {
      primaryValue = safeValue(item.calculation_basis);
    }

    return `<div class="data-tile"><span class="tile-label">${label}${side}</span><div class="tile-value">${primaryValue}${basis}${estimate}${payer}</div></div>`;
  }).join("");
}

function getCommissionBasis(data, annualSalary) {
  const basis = String(
    data.commission_basis || "basic_salary"
  ).trim().toLowerCase();

  const signingBonus =
    toNumber(data.signing_bonus) || 0;
  const guaranteedBonus =
    toNumber(data.guaranteed_bonus) || 0;
  const otherIncome =
    toNumber(data.other_commissionable_income) || 0;
  const customBasis =
    toNumber(data.custom_commission_basis_amount);

  if (basis === "custom" && customBasis !== null) {
    return {
      recurring: customBasis,
      oneOff: 0,
      total: customBasis
    };
  }

  const recurring = annualSalary || 0;
  let oneOff = 0;

  if (
    basis === "salary_plus_signing_bonus" ||
    basis === "guaranteed_remuneration" ||
    basis === "total_gross_remuneration" ||
    Boolean(data.signing_bonus_commissionable)
  ) oneOff += signingBonus;

  if (
    basis === "guaranteed_remuneration" ||
    basis === "total_gross_remuneration" ||
    Boolean(data.guaranteed_bonus_commissionable)
  ) oneOff += guaranteedBonus;

  if (
    basis === "total_gross_remuneration" ||
    Boolean(data.other_income_commissionable)
  ) oneOff += otherIncome;

  return {
    recurring,
    oneOff,
    total: recurring + oneOff
  };
}


function getAnnualisationRule(frequency) {
  const value = normaliseFrequency(frequency);
  if (["weekly", "week", "hebdomadaire", "semanal"].includes(value)) return { multiplier: 52, label: t("weeklyRule") };
  if (["monthly", "month", "mensuel", "mensuelle", "mensual"].includes(value)) return { multiplier: 12, label: t("monthlyRule") };
  if (["fortnightly", "biweekly", "quinzaine", "quincenal"].includes(value)) return { multiplier: 26, label: t("fortnightlyRule") };
  if (["yearly", "annual", "annually", "year", "annuel", "annuelle", "anual"].includes(value)) return { multiplier: 1, label: t("annualRule") };
  return { multiplier: null, label: t("na") };
}

function getCommissionBasisDisplay(data) {
  const basis = String(data.commission_basis || "basic_salary").trim().toLowerCase();
  const labels = {

function getCommissionMethodDisplay(method) {

function getCommissionableOneOffDisplay(data, currency) {
  const parts = [];
  const signing = toNumber(data.signing_bonus);
  const guaranteed = toNumber(data.guaranteed_bonus);

function parseContractAnalysis(data) {
  const raw = data?.analysis_json || data?.analysis_result || null;
  if (!raw) return null;

  if (typeof raw === "object") return raw;

  if (typeof raw === "string") {
    try {
      return JSON.parse(raw);
    } catch (error) {
      console.warn("Could not parse contract analysis JSON:", error);
    }
  }

  return null;
}

function normaliseResolverDate(value) {
  if (!value) return null;
  const text = String(value).trim();

  if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
    return text;
  }

  const parsed = new Date(text);
  if (Number.isNaN(parsed.getTime())) return null;

  const yyyy = parsed.getFullYear();
  const mm = String(parsed.getMonth() + 1).padStart(2, "0");
  const dd = String(parsed.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

function resolverSeasonFromDate(dateValue) {
  const date = normaliseResolverDate(dateValue);
  if (!date) return null;

  const [yearText, monthText] = date.split("-");
  const year = Number(yearText);
  const month = Number(monthText);

  if (!Number.isFinite(year) || !Number.isFinite(month)) return null;

  const startYear = month >= 7 ? year : year - 1;
  const endShort = String((startYear + 1) % 100).padStart(2, "0");
  return `${startYear}/${endShort}`;
}

function resolverSeasonFromNotes(notes, dueDate) {
  const text = String(notes || "");
  const match = text.match(/Season:\s*([0-9]{4}\/[0-9]{2,4})/i);
  return match?.[1] || resolverSeasonFromDate(dueDate);
}

function resolverNumber(value) {
  if (value === null || value === undefined || value === "") return null;
  if (typeof value === "number" && Number.isFinite(value)) return value;

  const parsed = Number(
    String(value)
      .replace(/\s/g, "")
      .replace(/,/g, "")
      .replace(/[^\d.-]/g, "")
  );

  return Number.isFinite(parsed) ? parsed : null;
}

function buildCommissionScheduleFromRows(data) {
  return (Array.isArray(currentContractInstalments)
    ? currentContractInstalments
    : [])
    .filter((item) => {
      const status = String(item?.invoice_status || "").trim().toLowerCase();

      return status !== "cancelled" && (
        Boolean(normaliseResolverDate(item?.due_date)) ||
        dueType === "relative_to_event" ||
        dueType === "unresolved"
      );
    })
    .map((item, index) => ({
      source: "commission_instalments",
      id: item.id || null,
      contract_id: item.contract_id || data?.id || null,
      instalment_number: item.instalment_number || index + 1,
      fee_side: item.fee_side || null,
      amount: resolverNumber(item.amount),
      currency: item.currency || data?.commission_currency || data?.salary_currency || null,
      due_date: normaliseResolverDate(item.due_date),
      component_reference: item.component_reference || null,
      component_type: item.component_type || null,
      classification_method: item.classification_method || null,
      due_date_type: item.due_date_type || (item.due_date ? "fixed_date" : "unresolved"),
      due_date_event: item.due_date_event || null,
      due_date_offset_days: resolverNumber(item.due_date_offset_days),
      due_date_rule: item.due_date_rule || null,
      trigger_date: normaliseResolverDate(item.trigger_date),
      payer: item.payer || data?.commission_payer || null,
      recipient: item.recipient || data?.commission_recipient || null,
      conditional: item.conditional ?? null,
      trigger_status: item.trigger_status || null,
      trigger_confirmed_at: item.trigger_confirmed_at || null,
      trigger_confirmed_by: item.trigger_confirmed_by || null,
      trigger_note: item.trigger_note || null,
      invoice_status: item.invoice_status || null,
      condition_notes: item.condition_notes || null,
      notes: item.notes || null,
      season_label: resolverSeasonFromNotes(item.notes || item.condition_notes, item.due_date),
      instalment_percentage: resolverNumber(item.instalment_percentage),
      calculation_basis: item.calculation_basis || null,
      vat_treatment: item.vat_treatment || null,
      source_document: item.source_document || null,
      source_clause: item.source_clause || null,
      date_source_text: item.date_source_text || null,
      amount_source_text: item.amount_source_text || null,
      payment_protection: item.payment_protection || null
    }));
}

function buildCommissionScheduleFromAnalysis(data) {
  const analysis = parseContractAnalysis(data);
  const obligations = Array.isArray(analysis?.payment_obligations)
    ? analysis.payment_obligations
    : [];

  return obligations
    .map((item, analysisIndex) => ({ item, analysisIndex }))
    .filter(({ item }) => {
      const type = String(item?.obligation_type || "").trim().toLowerCase();
      const dueDateType = String(item?.due_date_type || "").trim().toLowerCase();
      const hasExactDate = Boolean(normaliseResolverDate(item?.due_date));
      const hasRelativeRule = Boolean(
        String(item?.due_date_rule || item?.due_date_event || item?.trigger_event || "").trim()
      );
      const hasStatedAmount = resolverNumber(item?.amount) !== null;
      return type === "agency_commission" && (hasExactDate || hasRelativeRule || hasStatedAmount);
    })
    .map(({ item, analysisIndex }, index) => ({
      source: "analysis_json",
      id: null,
      analysis_index: analysisIndex,
      contract_id: data?.id || null,
      instalment_number: index + 1,
      component_reference: item.component_reference || null,
      component_type: item.component_type || null,
      classification_method: item.classification_method || null,
      fee_side: item.fee_side || null,
      amount: resolverNumber(item.amount),
      currency: item.currency || data?.commission_currency || data?.salary_currency || null,
      due_date: normaliseResolverDate(item.due_date),
      due_date_type:
        item.due_date_type === "relative_to_event" ||
        (!item.due_date && Boolean(item.due_date_rule || item.due_date_event || item.trigger_event))
          ? "relative_to_event"
          : (item.due_date_type || (item.due_date ? "fixed_date" : "unresolved")),
      due_date_event: item.due_date_event || null,
      due_date_offset_days: resolverNumber(item.due_date_offset_days),
      due_date_rule: item.due_date_rule || item.trigger_event || item.condition_notes || null,
      trigger_date: normaliseResolverDate(item.trigger_date),
      payer: item.payer || data?.commission_payer || null,
      recipient: item.recipient || data?.commission_recipient || null,
      conditional: item.conditional ?? null,
      trigger_status: item.trigger_status || (item.conditional ? "pending" : "guaranteed"),
      trigger_confirmed_at: item.trigger_confirmed_at || null,
      trigger_confirmed_by: item.trigger_confirmed_by || null,
      trigger_note: item.trigger_note || null,
      invoice_status: item.invoice_status || null,
      condition_notes: item.condition_notes || item.trigger_event || null,
      notes: item.description || null,
      season_label: item.season_label || resolverSeasonFromDate(item.due_date),
      instalment_percentage: resolverNumber(item.instalment_percentage),
      calculation_basis: item.calculation_basis || null,
      vat_treatment: item.vat_treatment || null,
      source_document: item.source_document || null,
      source_clause: item.source_clause || null,
      payment_protection: item.payment_protection || null
    }));
}

function extractInstalmentPercentage(item) {
  const explicit = resolverNumber(item?.instalment_percentage);
  if (explicit !== null) return explicit;

  const text = [item?.notes, item?.condition_notes]
    .filter(Boolean)
    .join(" ");

  const patterns = [
    /instalment(?:\s+allocation)?\s+(?:is\s+)?([0-9]+(?:\.[0-9]+)?)%/i,
    /([0-9]+(?:\.[0-9]+)?)%\s+(?:seasonal\s+)?instalment/i,
    /payable\s+([0-9]+(?:\.[0-9]+)?)%/i,
    /([0-9]+(?:\.[0-9]+)?)%\s+on\s+/i
  ];

  for (const pattern of patterns) {
    const match = text.match(pattern);
    if (match) {
      const value = resolverNumber(match[1]);
      if (value !== null) return value;
    }
  }

  return null;
}

function getSeasonBounds(seasonLabel, dueDate) {
  const label = String(seasonLabel || resolverSeasonFromDate(dueDate) || "");
  const match = label.match(/(\d{4})\/(\d{2,4})/);
  if (!match) return null;

  const startYear = Number(match[1]);
  if (!Number.isFinite(startYear)) return null;

  return {
    start: new Date(`${startYear}-07-01T00:00:00`),
    end: new Date(`${startYear + 1}-06-30T00:00:00`)
  };
}

function daysInclusive(start, end) {
  const day = 24 * 60 * 60 * 1000;
  return Math.floor((end - start) / day) + 1;
}

function getSeasonProration(data, item) {
  const bounds = getSeasonBounds(item?.season_label, item?.due_date);
  if (!bounds) return 1;

  const contractStartText = data?.playing_contract_start_date || data?.start_date;
  const contractEndText = data?.playing_contract_end_date || data?.end_date;
  const contractStart = contractStartText ? new Date(`${contractStartText}T00:00:00`) : bounds.start;
  const contractEnd = contractEndText ? new Date(`${contractEndText}T00:00:00`) : bounds.end;

  const overlapStart = contractStart > bounds.start ? contractStart : bounds.start;
  const overlapEnd = contractEnd < bounds.end ? contractEnd : bounds.end;
  if (overlapEnd < overlapStart) return 0;

  const seasonDays = daysInclusive(bounds.start, bounds.end);
  const activeDays = daysInclusive(overlapStart, overlapEnd);
  return seasonDays > 0 ? activeDays / seasonDays : 1;
}

function extractContractualAmountFromText(item) {
  const text = [
    item?.calculation_basis,
    item?.condition_notes,
    item?.trigger_note,
    item?.notes
  ].filter(Boolean).join(" | ");

  if (!text) return null;

  // Prefer amounts explicitly attached to amount / fee / payment wording.
  const contextualPatterns = [
    /(?:amount|fee|payment|instalment|installment|commission)[^€£$\d]{0,40}(?:EUR|GBP|USD|€|£|\$)\s*([0-9][0-9.,]*)/i,
    /(?:EUR|GBP|USD|€|£|\$)\s*([0-9][0-9.,]*)[^.]{0,50}(?:amount|fee|payment|instalment|installment|commission)/i
  ];

  for (const pattern of contextualPatterns) {
    const match = text.match(pattern);
    if (match) {
      const value = resolverNumber(match[1]);
      if (value !== null && value > 0) return value;
    }
  }

  // Fallback: a currency-marked amount is still safer than treating a
  // contractually stated conditional payment as zero / not recorded.
  const currencyMatch = text.match(/(?:EUR|GBP|USD|€|£|\$)\s*([0-9][0-9.,]*)/i);
  if (currencyMatch) {
    const value = resolverNumber(currencyMatch[1]);
    if (value !== null && value > 0) return value;
  }

  return null;
}

function resolveConditionalFlag(item) {
  const storedFlag = String(item?.conditional ?? "").trim().toLowerCase();

  // The structured row is the source of truth. Do not downgrade a stored
  // conditional payment to guaranteed merely because its notes use wording
  // that is not covered by a narrow phrase-matching list.
  if (["true", "1", "yes", "conditional"].includes(storedFlag)) return true;
  if (["false", "0", "no", "guaranteed"].includes(storedFlag)) return false;

  // Older rows may have a trigger status but no explicit conditional flag.
  const storedStatus = String(item?.trigger_status || "").trim().toLowerCase();
  return ["pending", "met", "confirmed", "satisfied", "fulfilled", "failed", "not_met", "not-met"].includes(storedStatus);
}

function calculateScheduleItemAmount(data, item) {
  const allocation = extractInstalmentPercentage(item);
  const method = normaliseCommissionMethod(data);
  const annualSalary = calculateAnnualSalary(data?.salary, data?.salary_frequency);
  const feeSide = String(item?.fee_side || "").trim().toLowerCase();
  const isClubSide = /club/.test(feeSide);
  const isPlayerSide = /player/.test(feeSide);
  const rate =
    resolverNumber(data?.commission_percentage) ??
    (method === "percentage" || method === "mixed"
      ? resolverNumber(data?.commission_value)
      : null);

  const recorded = resolverNumber(item?.amount);
  const statedAmount = extractContractualAmountFromText(item);

  /*
   * Club-side service fees are fixed contractual amounts and must never be
   * replaced by the player's salary-percentage calculation. This preserves
   * amounts such as EUR 115,000 and EUR 100,000 exactly as recorded.
   */
  if (isClubSide) {
    if (recorded !== null) return { amount: recorded, estimated: false, allocation };
    if (statedAmount !== null) return { amount: statedAmount, estimated: false, allocation };
    return { amount: null, estimated: false, allocation };
  }

  /*
   * Player-side remuneration is calculated from the recorded basic salary and
   * commission rate (10% for this contract), then split only when the row has a
   * contractual instalment allocation.
   */
  if (isPlayerSide && annualSalary !== null && rate !== null) {
    const proratedSalary = annualSalary * getSeasonProration(data, item);
    const grossCommissionForSide = proratedSalary * (rate / 100);
    const amount = allocation !== null
      ? grossCommissionForSide * (allocation / 100)
      : grossCommissionForSide;

    return {
      amount,
      estimated: true,
      allocation
    };
  }

  // For legacy rows without a recognised fee-side label, preserve an explicit
  // contractual amount before attempting any derived percentage calculation.
  if (recorded !== null) {
    return { amount: recorded, estimated: false, allocation };
  }

  // Conditional contractual amounts must remain visible even while their
  // trigger is pending. If the structured row did not persist the amount,
  // recover an amount stated in that row's contractual analysis text.
  if (statedAmount !== null) {
    return { amount: statedAmount, estimated: false, allocation };
  }

  if (annualSalary !== null && rate !== null && allocation !== null) {
    const proratedSalary = annualSalary * getSeasonProration(data, item);
    return {
      amount: proratedSalary * (rate / 100) * (allocation / 100),
      estimated: true,
      allocation
    };
  }

  return { amount: null, estimated: false, allocation };
}

function enrichScheduleAmounts(data, scheduleItems) {
  return scheduleItems.map((item) => {
    const calculated = calculateScheduleItemAmount(data, item);
    return {
      ...item,
      // Preserve the amount whether guaranteed or conditional. Trigger status
      // controls certainty / invoice readiness; it must not erase value.
      amount: calculated.amount,
      amount_estimated: calculated.estimated,
      conditional: resolveConditionalFlag(item),
      trigger_status: resolveConditionalFlag(item)
        ? (item.trigger_status || "pending")
        : "guaranteed",
      instalment_percentage:
        item.instalment_percentage ?? calculated.allocation
    };
  });
}

function normaliseTriggerStatus(item) {
  if (!item?.conditional) return "guaranteed";
  const raw = String(item?.trigger_status || "").trim().toLowerCase();
  if (["met", "confirmed", "satisfied", "fulfilled"].includes(raw)) return "met";
  if (["failed", "not_met", "not-met", "expired", "cancelled"].includes(raw)) return "failed";
  return "pending";
}

function isPotentialRevenueItem(item) {
  const invoiceStatus = String(item?.invoice_status || "").trim().toLowerCase();
  return invoiceStatus !== "cancelled" && normaliseTriggerStatus(item) !== "failed";
}

function isConfirmedRevenueItem(item) {
  if (!isPotentialRevenueItem(item)) return false;
  return !item?.conditional || normaliseTriggerStatus(item) === "met";
}

function triggerStatusLabel(item) {
  const status = normaliseTriggerStatus(item);
  if (status === "guaranteed") return t("triggerGuaranteed");
  if (status === "met") return t("triggerConditionalMet");
  if (status === "failed") return t("triggerConditionalFailed");
  return t("triggerConditionalPending");
}

function triggerStatusClass(item) {
  const status = normaliseTriggerStatus(item);
  return status === "guaranteed" ? "" : status;
}

async function setConditionalTriggerStatus(instalmentId, nextStatus, button) {
  if (!instalmentId || !currentDb || !currentContract?.id) {
    alert(t("triggerNeedsStoredRow"));
    return;
  }

  const original = button?.textContent || "";
  if (button) { button.disabled = true; button.textContent = t("triggerSaving"); }

  const payload = {
    trigger_status: nextStatus,
    trigger_confirmed_at: nextStatus === "met" ? new Date().toISOString() : null,
    trigger_confirmed_by: nextStatus === "met" ? currentUser?.id || null : null
  };

  const { error } = await currentDb
    .from("commission_instalments")
    .update(payload)
    .eq("id", instalmentId)
    .eq("contract_id", currentContract.id);

  if (error) {
    console.error("Trigger status update failed:", error);
    alert(`${t("triggerSaveFailed")} ${error.message || ""}`.trim());
    if (button) { button.disabled = false; button.textContent = original; }
    return;
  }

  const row = currentContractInstalments.find((item) => String(item.id) === String(instalmentId));
  if (row) {
    row.trigger_status = nextStatus;
    row.trigger_confirmed_at = payload.trigger_confirmed_at;
    row.trigger_confirmed_by = payload.trigger_confirmed_by;
  }

  renderContract(currentContract);
}

function addContractualDays(dateText, offsetDays) {
  const date = new Date(`${dateText}T00:00:00Z`);
  const offset = resolverNumber(offsetDays);
  if (Number.isNaN(date.getTime()) || offset === null) return null;
  date.setUTCDate(date.getUTCDate() + offset);
  return date.toISOString().slice(0, 10);
}

function revealRelativeTriggerDateInput(button) {
  const editor = button?.closest(".trigger-cell")?.querySelector(".trigger-date-editor");
  if (editor) {
    editor.hidden = false;
    editor.querySelector("input[type='date']")?.focus();
  }
}

async function saveRelativeTriggerDate(analysisIndex, instalmentId, button) {
  const editor = button?.closest(".trigger-date-editor");
  const input = editor?.querySelector("input[type='date']");
  const triggerDate = normaliseResolverDate(input?.value);
  if (!triggerDate) {
    alert(t("invalidTriggerDate"));
    return;
  }

  const analysis = parseContractAnalysis(currentContract);
  const obligations = Array.isArray(analysis?.payment_obligations)
    ? analysis.payment_obligations
    : [];
  const hasAnalysisIndex = analysisIndex !== null && analysisIndex !== undefined && Number(analysisIndex) >= 0;
  const obligation = hasAnalysisIndex ? obligations[Number(analysisIndex)] : null;
  const storedRow = instalmentId
    ? currentContractInstalments.find((item) => String(item?.id) === String(instalmentId))
    : null;
  const target = obligation || storedRow;
  if (!target || !currentDb || !currentContract?.id || !currentUser?.id) {
    alert(t("triggerDateSaveFailed"));
    return;
  }

  const originalText = button.textContent;
  button.disabled = true;
  button.textContent = t("triggerSaving");

  const confirmedAt = new Date().toISOString();
  target.trigger_date = triggerDate;
  target.trigger_status = "met";
  target.trigger_confirmed_at = confirmedAt;
  target.trigger_confirmed_by = currentUser.id;

  const calculatedDueDate = addContractualDays(
    triggerDate,
    target.due_date_offset_days
  );
  if (calculatedDueDate) {
    target.due_date = calculatedDueDate;
    target.due_date_confirmed = true;
  }

  if (storedRow) {
    const { error: rowError } = await currentDb
      .from("commission_instalments")
      .update({
        trigger_date: triggerDate,
        trigger_status: "met",
        trigger_confirmed_at: confirmedAt,
        trigger_confirmed_by: currentUser.id,
        due_date: calculatedDueDate,
        due_date_confirmed: Boolean(calculatedDueDate)
      })
      .eq("id", storedRow.id)
      .eq("contract_id", currentContract.id);
    if (rowError) {
      console.error("Relative trigger row save failed:", rowError);
      alert(`${t("triggerDateSaveFailed")} ${rowError.message || ""}`.trim());
      button.disabled = false;
      button.textContent = originalText;
      return;
    }
  }

  const payload = {};
  if (Object.prototype.hasOwnProperty.call(currentContract, "analysis_json")) {
    payload.analysis_json = analysis;
  }
  if (Object.prototype.hasOwnProperty.call(currentContract, "analysis_result")) {
    payload.analysis_result = analysis;
  }

  const { error } = Object.keys(payload).length
    ? await currentDb
        .from("contracts")
        .update(payload)
        .eq("id", currentContract.id)
        .eq("user_id", currentUser.id)
    : { error: null };

  if (error) {
    console.error("Relative trigger date save failed:", error);
    alert(`${t("triggerDateSaveFailed")} ${error.message || ""}`.trim());
    button.disabled = false;
    button.textContent = originalText;
    return;
  }

  if (Object.prototype.hasOwnProperty.call(currentContract, "analysis_json")) {
    currentContract.analysis_json = analysis;
  }
  if (Object.prototype.hasOwnProperty.call(currentContract, "analysis_result")) {
    currentContract.analysis_result = analysis;
  }

  renderContract(currentContract);
}

function renderTriggerControl(item) {

window.__dealtrackScheduleDetails = window.__dealtrackScheduleDetails || {};
let schedulePopoverHideTimer = null;
let schedulePopoverAnchor = null;

function ensureSchedulePopover() {
  let popover = document.getElementById("dealtrackSchedulePopover");
  if (popover) return popover;

  popover = document.createElement("div");
  popover.id = "dealtrackSchedulePopover";
  popover.className = "schedule-popover";
  popover.setAttribute("role", "dialog");
  popover.setAttribute("aria-hidden", "true");
  popover.addEventListener("mouseenter", () => clearTimeout(schedulePopoverHideTimer));
  popover.addEventListener("mouseleave", () => scheduleSchedulePopoverHide());
  document.body.appendChild(popover);
  return popover;
}

function positionSchedulePopover(anchor, popover) {
  const rect = anchor.getBoundingClientRect();
  const gap = 10;
  const margin = 12;

  // Measure after content is rendered but before it is shown.
  popover.style.left = `${margin}px`;
  popover.style.top = `${margin}px`;
  const box = popover.getBoundingClientRect();

  let left = rect.right + gap;
  if (left + box.width > window.innerWidth - margin) {
    left = rect.left - box.width - gap;
  }
  if (left < margin) {
    left = Math.min(Math.max(margin, rect.left), window.innerWidth - box.width - margin);
  }

  let top = rect.top + (rect.height / 2) - (box.height / 2);
  top = Math.max(margin, Math.min(top, window.innerHeight - box.height - margin));

  popover.style.left = `${Math.round(left)}px`;
  popover.style.top = `${Math.round(top)}px`;
}

function showSchedulePopover(anchor, detailId) {
  clearTimeout(schedulePopoverHideTimer);
  const fields = window.__dealtrackScheduleDetails?.[detailId] || [];
  const popover = ensureSchedulePopover();
  schedulePopoverAnchor = anchor;

  const body = fields.length
    ? fields.map((field) => `
        <div class="schedule-popover-field">
          <div class="schedule-popover-label">${safeValue(field.label)}</div>
          <div class="schedule-popover-value">${safeValue(field.value)}</div>
        </div>`).join("")
    : `<div class="schedule-popover-value">${safeValue(t("na"))}</div>`;

  popover.innerHTML = `
    <div class="schedule-popover-header">${safeValue(t("paymentDetailsTitle"))}</div>
    <div class="schedule-popover-body">${body}</div>`;
  popover.classList.add("is-open");
  popover.setAttribute("aria-hidden", "false");
  anchor.setAttribute("aria-expanded", "true");
  positionSchedulePopover(anchor, popover);
}

function hideSchedulePopover() {
  clearTimeout(schedulePopoverHideTimer);
  const popover = document.getElementById("dealtrackSchedulePopover");
  if (popover) {
    popover.classList.remove("is-open");
    popover.setAttribute("aria-hidden", "true");
  }
  if (schedulePopoverAnchor) schedulePopoverAnchor.setAttribute("aria-expanded", "false");
  schedulePopoverAnchor = null;
}

function scheduleSchedulePopoverHide() {
  clearTimeout(schedulePopoverHideTimer);
  schedulePopoverHideTimer = setTimeout(hideSchedulePopover, 140);
}

function toggleSchedulePopover(anchor, detailId, event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  const popover = ensureSchedulePopover();
  const sameAnchor = schedulePopoverAnchor === anchor && popover.classList.contains("is-open");
  if (sameAnchor) hideSchedulePopover();
  else showSchedulePopover(anchor, detailId);
}

document.addEventListener("click", (event) => {

  if (!popover || !popover.classList.contains("is-open")) return;
  if (popover.contains(event.target) || event.target.closest(".details-btn")) return;

});

window.addEventListener("scroll", () => {

function getDistinctPaymentEvents(scheduleItems) {
  const events = new Map();

  for (const item of scheduleItems) {
    const date = normaliseResolverDate(item.due_date);
    if (!date) continue;

    const season = item.season_label || resolverSeasonFromDate(date) || "";
    const key = `${season}|${date}`;

    if (!events.has(key)) {
      events.set(key, {
        season_label: season || null,
        due_date: date,
        percentages: new Set(),
        fee_sides: new Set(),
        payers: new Set(),
        currencies: new Set(),
        amounts: [],
        source_rows: []
      });
    }

    const event = events.get(key);

    if (item.instalment_percentage !== null && item.instalment_percentage !== undefined) {
      event.percentages.add(item.instalment_percentage);
    }

    if (item.fee_side) event.fee_sides.add(item.fee_side);
    if (item.payer) event.payers.add(item.payer);
    if (item.currency) event.currencies.add(item.currency);
    if (item.amount !== null && item.amount !== undefined) event.amounts.push(item.amount);
    event.source_rows.push(item);
  }

  return Array.from(events.values()).sort(
    (a, b) => String(a.due_date).localeCompare(String(b.due_date))
  );
}

function inferPaymentPattern(scheduleItems, data) {
  if (!scheduleItems.length) {
    return {
      frequency: data?.commission_frequency || null,
      instalments: resolverNumber(data?.commission_instalments),
      payment_events: []
    };
  }

  const events = getDistinctPaymentEvents(scheduleItems);
  const bySeason = new Map();

  for (const event of events) {
    const season = event.season_label || "__all__";
    if (!bySeason.has(season)) bySeason.set(season, []);
    bySeason.get(season).push(event);
  }

  const counts = Array.from(bySeason.values())
    .map((items) => items.length)
    .filter((count) => count > 0);

  const instalmentsPerPeriod =
    counts.length > 0 ? Math.max(...counts) : events.length;

  let frequency = data?.commission_frequency || null;

  if (!frequency && instalmentsPerPeriod > 0) {
    if (instalmentsPerPeriod === 1) {
      frequency = t("oncePerSeason") || "Once per season";
    } else if (instalmentsPerPeriod === 2) {
      frequency = t("twicePerSeason") || "Twice per season";
    } else {
      const template = t("instalmentsPerSeason");
      frequency = String(template || "{count} instalments per season")
        .replace("{count}", instalmentsPerPeriod);
    }
  }

  return {
    frequency,
    instalments: instalmentsPerPeriod || null,
    payment_events: events
  };
}

function resolveCommission(data) {
  const detailedRows = buildCommissionScheduleFromRows(data);
  const analysisRows = buildCommissionScheduleFromAnalysis(data);

  let schedule = [];
  let source = "contracts";

  if (detailedRows.length > 0) {
    const supplementalAnalysisRows = analysisRows.filter(
      (item) => {
        if (!(item.due_date_type === "relative_to_event" || !item.due_date)) return false;
        return !detailedRows.some((stored) =>
          String(stored.component_reference || "") === String(item.component_reference || "") &&
          resolverNumber(stored.amount) === resolverNumber(item.amount) &&
          String(stored.due_date_rule || "") === String(item.due_date_rule || "")
        );
      }
    );
    schedule = [...detailedRows, ...supplementalAnalysisRows];
    source = "commission_instalments";
  } else if (analysisRows.length > 0) {
    schedule = analysisRows;
    source = "analysis_json";
  }

  schedule = enrichScheduleAmounts(data, schedule);
  const pattern = inferPaymentPattern(schedule, data);
  const analysis = parseContractAnalysis(data);

  const method =
    data?.commission_method ||
    data?.commission_type ||
    analysis?.commission_type ||
    null;

  const rate =
    resolverNumber(data?.commission_percentage) ??
    resolverNumber(data?.commission_value) ??
    resolverNumber(analysis?.commission_percentage) ??
    resolverNumber(analysis?.commission_value);

  const fixedAmount =
    resolverNumber(data?.fixed_commission_amount) ??
    resolverNumber(analysis?.club_services_fee) ??
    resolverNumber(analysis?.player_services_fee);

  const basis =
    data?.commission_basis ||
    analysis?.commission_basis ||
    schedule.find((item) => item.calculation_basis)?.calculation_basis ||
    null;

  const warnings = [];
  if (!schedule.length && !data?.commission_frequency && !data?.commission_instalments) {
    warnings.push(t("resolverReviewRequired"));
  }

  return {
    source,
    method,
    rate,
    fixed_amount: fixedAmount,
    basis,
    payer: data?.commission_payer || analysis?.commission_payer || null,
    recipient: data?.commission_recipient || analysis?.commission_recipient || null,
    currency: data?.commission_currency || analysis?.commission_currency || data?.salary_currency || "GBP",
    dual_representation: Boolean(
      data?.is_dual_representation ??
      data?.dual_representation ??
      analysis?.dual_representation
    ),
    payment_frequency: pattern.frequency,
    instalments_per_period: pattern.instalments,
    payment_events: pattern.payment_events,
    schedule,
    warnings
  };
}

function getInstalmentMetrics(data) {
  const resolvedCommission = resolveCommission(data);
  const items = resolvedCommission.schedule.filter(isPotentialRevenueItem);

  if (!items.length) return null;

  const reportingYear = new Date().getFullYear();
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const currency = items.find((item) => item.currency)?.currency || getCurrencyCode(data);
  const sumItems = (list) => list.reduce((sum, item) => sum + (toNumber(item.amount) || 0), 0);
  const inYear = (item) => {
    let reportingDate = item.due_date || item.trigger_date || null;
    if (!reportingDate && item.due_date_type === "relative_to_event") {
      const eventText = String(item.due_date_event || item.due_date_rule || item.condition_notes || "").toLowerCase();
      if (/registration|signing|execution|commencement|transfer|employment start|contract start/.test(eventText)) {
        reportingDate = data.playing_contract_start_date || data.start_date || null;
      }
    }
    if (!reportingDate) return false;
    const dueDate = new Date(`${reportingDate}T00:00:00`);
    return !Number.isNaN(dueDate.getTime()) && dueDate.getFullYear() === reportingYear;
  };

  const confirmedItems = items.filter(isConfirmedRevenueItem);
  const conditionalPendingItems = items.filter((item) => item.conditional && normaliseTriggerStatus(item) === "pending");

  const lifetimeRevenue = sumItems(items);
  const guaranteedLifetimeRevenue = sumItems(confirmedItems);
  const conditionalPendingLifetimeRevenue = sumItems(conditionalPendingItems);

  const annualItems = items.filter(inYear);
  const annualRevenue = sumItems(annualItems);
  const guaranteedAnnualRevenue = sumItems(annualItems.filter(isConfirmedRevenueItem));
  const conditionalPendingAnnualRevenue = sumItems(annualItems.filter((item) => item.conditional && normaliseTriggerStatus(item) === "pending"));

  const futureItems = items
    .filter((item) => {
      if (!item.due_date) return false;
      const status = String(item.invoice_status || "").toLowerCase();
      if (status === "paid") return false;
      const dueDate = new Date(`${item.due_date}T00:00:00`);
      return !Number.isNaN(dueDate.getTime());
    })
    .sort((a, b) => String(a.due_date).localeCompare(String(b.due_date)));

  const nextDueDate = futureItems[0]?.due_date || null;
  const nextInvoiceAmount = nextDueDate
    ? sumItems(futureItems.filter((item) => item.due_date === nextDueDate))
    : 0;

  return {
    currency, reportingYear,
    annualRevenue, lifetimeRevenue, nextInvoiceAmount, nextDueDate, items,
    guaranteedAnnualRevenue, conditionalPendingAnnualRevenue,
    guaranteedLifetimeRevenue, conditionalPendingLifetimeRevenue
  };
}

function renderCommercialValue(data) {

          </span>

          <div class="commercial-total-value">
            ${formatMoneyValue(
              instalmentMetrics.lifetimeRevenue,
              instalmentMetrics.currency
            )}
          </div>

          <div class="commercial-value-period">
            ${termText}
          </div>
        </div>

        <div class="commercial-calculation">
          <h4>${t("commercialCalculation")}</h4>

          <div class="commercial-calculation-grid">
            <div>
              <span>${t("representationType")}</span>
              <strong>
                ${data.is_dual_representation
                  ? t("dualRepresentationValue")
                  : t("singleRepresentationValue")}
              </strong>
            </div>

            <div>
              <span>${t("labelCommissionType")}</span>
              <strong>${safeValue(data.commission_method || data.commission_type)}</strong>
            </div>

            <div>
              <span>${t("expectedAnnualRevenue")}</span>
              <strong>
                ${formatMoneyValue(
                  instalmentMetrics.annualRevenue,
                  instalmentMetrics.currency
                )}
              </strong>
            </div>

            <div>
              <span>${t("expectedContractRevenue")}</span>
              <strong>
                ${formatMoneyValue(
                  instalmentMetrics.lifetimeRevenue,
                  instalmentMetrics.currency
                )}
              </strong>
            </div>
            <div>
              <span>${t("guaranteedRevenueLabel")}</span>
              <strong>${formatMoneyValue(instalmentMetrics.guaranteedLifetimeRevenue, instalmentMetrics.currency)}</strong>
            </div>
            <div>
              <span>${t("conditionalPendingRevenueLabel")}</span>
              <strong>${formatMoneyValue(instalmentMetrics.conditionalPendingLifetimeRevenue, instalmentMetrics.currency)}</strong>
            </div>
            <div>
              <span>${t("potentialRevenueLabel")}</span>
              <strong>${formatMoneyValue(instalmentMetrics.lifetimeRevenue, instalmentMetrics.currency)}</strong>
            </div>
          </div>

          <div class="calculation-formula">
            <strong>${t("calculationMethod")}:</strong> ${t("contractualSchedule")}<br>
            <strong>${t("currentYearRevenue")}:</strong> ${formatMoneyValue(instalmentMetrics.annualRevenue, instalmentMetrics.currency)}<br>

          </div>

          <p class="commercial-note">* ${t("estimatedFromKnownTerms")}. ${t("knownSalaryOnlyNote")}</p>

          <p class="commercial-note">
            ${t("auditNote")}
          </p>
        </div>
      </section>
    `;
  }

  const annualSalary =
    calculateAnnualSalary(
      data.salary,
      data.salary_frequency
    );

  const method = normaliseCommissionMethod(data);
  const commissionRate = toNumber(
    data.commission_percentage ??
    (method === "percentage" ? data.commission_value : null)
  );
  const fixedAmount = toNumber(
    data.fixed_commission_amount ??
    (method === "fixed" ? data.commission_value : null)
  );

  const contractYears =
    calculateContractYears(
      data.playing_contract_start_date || data.start_date,
      data.playing_contract_end_date || data.end_date
    );

  const isDual = Boolean(data.is_dual_representation);
  const currency = getCurrencyCode(data);
  const basis = getCommissionBasis(data, annualSalary);

  const percentageMultiplier =
    isDual && data.dual_representation_multiplier == null
      ? 2
      : Math.max(
          1,
          toNumber(data.dual_representation_multiplier) || 1
        );

  const fixedMultiplier =
    isDual && Boolean(data.fixed_commission_per_side)
      ? 2
      : 1;

  const recurringPercentage =
    commissionRate !== null
      ? basis.recurring *
        (commissionRate / 100) *
        percentageMultiplier
      : 0;

  const oneOffPercentage =
    commissionRate !== null
      ? basis.oneOff *
        (commissionRate / 100) *
        percentageMultiplier
      : 0;

  const fixedCommission =
    fixedAmount !== null
      ? fixedAmount * fixedMultiplier
      : 0;

  /*
   * IMPORTANT:
   * A fixed commission amount is a total contractual amount unless a
   * recorded instalment schedule tells us when the revenue falls due.
   * Never present the whole fixed fee as "annual revenue".
   */
  if (
    method === "fixed" &&
    fixedAmount !== null &&
    !instalmentMetrics
  ) {
    const termText =
      contractYears !== null
        ? t("overContractTerm").replace("{years}", contractYears)

    return `

          <div class="commercial-value-period">
            ${new Date().getFullYear()}

        </div>

        <div class="commercial-total-box">
          <span class="commercial-value-label">
            ${t("expectedContractRevenue")}
          </span>

          <div class="commercial-total-value">
            ${formatMoneyValue(
              fixedCommission,
              currency
            )}
          </div>

          <div class="commercial-value-period">
            ${termText}
          </div>
        </div>

        <div class="commercial-calculation">
          <h4>${t("commercialCalculation")}</h4>

          <div class="commercial-calculation-grid">
            <div>
              <span>${t("representationType")}</span>
              <strong>
                ${isDual
                  ? t("dualRepresentationValue")
                  : t("singleRepresentationValue")}
              </strong>
            </div>

            <div>
              <span>${t("labelCommissionType")}</span>
              <strong>${safeValue(data.commission_method || data.commission_type)}</strong>
            </div>

            <div>
              <span>${t("expectedAnnualRevenue")}</span>
              <strong>${t("na")}</strong>
            </div>

            <div>
              <span>${t("expectedContractRevenue")}</span>
              <strong>
                ${formatMoneyValue(
                  fixedCommission,
                  currency
                )}
              </strong>
            </div>
          </div>

          <p class="commercial-note">
            ${t("fixedScheduleRequired")}
          </p>
        </div>
      </section>
    `;
  }

  let totalAnnualRevenue = null;
  let totalContractRevenue = null;

  if (
    method === "percentage" &&
    commissionRate !== null &&
    contractYears !== null
  ) {
    totalAnnualRevenue =
      recurringPercentage + oneOffPercentage;

    totalContractRevenue =
      recurringPercentage * contractYears +
      oneOffPercentage;
  } else if (
    method === "mixed" &&
    commissionRate !== null &&
    fixedAmount !== null &&
    contractYears !== null
  ) {
    totalAnnualRevenue =
      recurringPercentage +
      oneOffPercentage +
      fixedCommission;

    totalContractRevenue =
      recurringPercentage * contractYears +
      oneOffPercentage +
      fixedCommission;
  }

  if (
    totalAnnualRevenue === null ||
    totalContractRevenue === null
  ) {
    return `
      <section class="premium-card commercial-value-card">
        <div class="section-head">
          <div>
            <div class="section-kicker">06</div>
            <h2 class="section-title">
              ${t("sectionCommercialValue")}
            </h2>
          </div>
        </div>

        <div class="commercial-warning">
          ${t("commercialValueUnavailable")}
        </div>
      </section>
    `;
  }

  const termText =
    contractYears !== null
      ? t("overContractTerm").replace("{years}", contractYears)
      : t("na");

  return `
    <section class="premium-card commercial-value-card">
      <div class="section-head">
        <div>
          <div class="section-kicker">06</div>
          <h2 class="section-title">
            ${t("sectionCommercialValue")}
          </h2>
        </div>
      </div>

      <p class="muted">
        ${t("commercialValueSubtitle")}
      </p>

      <div class="commercial-value-headline">

          ${t("expectedAnnualRevenue")}
        </span>

          ${formatMoneyValue(
            totalAnnualRevenue,
            currency
          )}
        </div>

        <div class="commercial-value-period">
          ${t("perYear")}
        </div>
      </div>

      <div class="commercial-total-box">
        <span class="commercial-value-label">
          ${t("expectedContractRevenue")}
        </span>

        <div class="commercial-total-value">
          ${formatMoneyValue(

            currency
          )}
        </div>

        <div class="commercial-value-period">
          ${termText}
        </div>
      </div>

      <div class="commercial-calculation">
        <h4>${t("commercialCalculation")}</h4>

        <div class="commercial-calculation-grid">

            <strong>${formatMoneyValue(data.salary, data.salary_currency || currency)} ${safeValue(data.salary_frequency)}</strong>
          </div>
          <div>
            <span>${t("annualisationRule")}</span>
            <strong>${getAnnualisationRule(data.salary_frequency).label}</strong>
          </div>
          <div>
            <span>${t("annualisedSalary")}</span>
            <strong>${formatMoneyValue(annualSalary, data.salary_currency || currency)}</strong>
          </div>
          <div>
            <span>${t("commissionBasisLabel")}</span>
            <strong>${getCommissionBasisDisplay(data)}</strong>
          </div>
          <div>
            <span>${t("commissionableOneOffs")}</span>
            <strong>${getCommissionableOneOffDisplay(data, currency)}</strong>
          </div>
          <div>
            <span>${t("annualSalaryBasis")}</span>
            <strong>${formatMoneyValue(basis.total, currency)}</strong>
          </div>
          <div>
            <span>${t("commissionRateLabel")}</span>
            <strong>${commissionRate !== null ? `${commissionRate}%` : t("na")}</strong>
          </div>
          <div>
            <span>${t("representationType")}</span>
            <strong>${isDual ? t("dualRepresentationValue") : t("singleRepresentationValue")}</strong>

function formatDateValue(dateValue) {
  if (!dateValue) return t("invoiceDatePending");

  const localeMap = {
    en: "en-GB",
    fr: "fr-FR",
    es: "es-ES"
  };

  return new Intl.DateTimeFormat(
    localeMap[currentLang] || "en-GB",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  ).format(new Date(`${dateValue}T00:00:00`));
}

function renderInvoiceForecast(data) {
  const instalmentMetrics = getInstalmentMetrics(data);

  if (instalmentMetrics) {
    const futureGroups = new Map();
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    instalmentMetrics.items.forEach((item) => {
      const status = String(item.invoice_status || "").toLowerCase();
      if (status === "cancelled") return;
      const isRelativePending = !item.due_date && item.due_date_type === "relative_to_event";
      if (!item.due_date && !isRelativePending) return;
      const dueDate = item.due_date ? new Date(`${item.due_date}T00:00:00`) : null;
      if (dueDate && Number.isNaN(dueDate.getTime())) return;

      const key = item.due_date || `pending:${item.component_reference || item.instalment_number || "relative"}`;
      if (!futureGroups.has(key)) {
        futureGroups.set(key, {
          dueDate: item.due_date || null,
          amount: 0,
          currency: item.currency || instalmentMetrics.currency,
          items: []
        });
      }
      const group = futureGroups.get(key);
      group.amount += toNumber(item.amount) || 0;
      group.items.push(item);
    });

    const groups = [...futureGroups.values()].sort((a, b) =>
      String(a.dueDate || "").localeCompare(String(b.dueDate || ""))
    );

    if (!groups.length) {
      return `
        <section class="premium-card invoice-forecast-card">
          <div class="section-head"><div><div class="section-kicker">07</div><h2 class="section-title">${t("sectionInvoiceForecast")}</h2></div></div>
          <div class="commercial-warning">${t("no")} ${t("invoiceStatusForecast")}</div>
        </section>`;
    }

    const tableId = `invoice-forecast-${String(data.id || "record").replace(/[^a-zA-Z0-9_-]/g, "")}`;
    const visibleLimit = 6;
    const rows = groups.map((group, index) => {
      const sides = [...new Set(group.items.map((item) => item.fee_side).filter(Boolean))].join(" + ");
      const payers = [...new Set(group.items.map((item) => item.payer).filter(Boolean))].join(" / ");
      const extraClass = index >= visibleLimit ? "schedule-row-extra schedule-row-hidden" : "";
      return `
        <tr class="${extraClass}">
          <td>${index + 1}</td>
          <td><strong>${formatDateValue(group.dueDate)}</strong></td>
          <td>${safeValue(sides)}</td>
          <td><span class="amount-known">${formatMoneyValue(group.amount, group.currency)}</span></td>
          <td class="payer-cell">${safeValue(payers)}</td>
          <td>${group.items.some((item) => item.conditional && normaliseTriggerStatus(item) === "pending") ? t("triggerConditionalPending") : group.items.some((item) => item.conditional && normaliseTriggerStatus(item) === "met") ? t("triggerConditionalMet") : t("invoiceStatusForecast")}</td>
        </tr>`;
    }).join("");

    return `
      <section class="premium-card invoice-forecast-card">
        <div class="section-head"><div><div class="section-kicker">07</div><h2 class="section-title">${t("sectionInvoiceForecast")}</h2></div></div>
        <p class="muted">${t("invoiceForecastSubtitle")}</p>
        <div class="schedule-toolbar">
          <div class="schedule-count">${groups.length} ${t("sectionInvoiceForecast")}</div>
          ${groups.length > visibleLimit ? `<button type="button" class="schedule-toggle" onclick="toggleScheduleRows('${tableId}', this)">${t("showAllPayments")}</button>` : ""}
        </div>
        <div class="audit-schedule">
          <table id="${tableId}" class="compact-forecast-table">
            <thead><tr>
              <th>#</th>
              <th>${t("paymentDueDate")}</th>
              <th>${t("invoiceType")}</th>
              <th>${t("invoiceAmount")}</th>
              <th>${t("invoicePayer")}</th>
              <th>${t("invoiceStatus")}</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <p class="invoice-forecast-note">${t("invoiceForecastNote")}</p>
      </section>`;
  }

  const annualSalary =
    calculateAnnualSalary(
      data.salary,
      data.salary_frequency
    );

  const method = normaliseCommissionMethod(data);
  const commissionRate =
    toNumber(
      data.commission_percentage ??
      (method === "percentage"
        ? data.commission_value
        : null)
    );

  if (
    annualSalary === null ||
    commissionRate === null
  ) {
    return `
      <section class="premium-card invoice-forecast-card">
        <div class="section-head">
          <div>
            <div class="section-kicker">07</div>
            <h2 class="section-title">
              ${t("sectionInvoiceForecast")}
            </h2>
          </div>
        </div>

        <div class="commercial-warning">
          ${t("commercialValueUnavailable")}
        </div>
      </section>
    `;
  }

  const currency = getCurrencyCode(data);
  const basis = getCommissionBasis(data, annualSalary);

  const annualSideAmount =
    basis.total *
    (commissionRate / 100);

  const isDual =
    Boolean(data.is_dual_representation);

  const payer =
    data.commission_payer ||
    data.club_name ||
    null;

  return `
    <section class="premium-card invoice-forecast-card">
      <div class="section-head">
        <div>
          <div class="section-kicker">07</div>
          <h2 class="section-title">
            ${t("sectionInvoiceForecast")}
          </h2>
        </div>
      </div>

      <p class="muted">
        ${t("invoiceForecastSubtitle")}
      </p>

      <div class="invoice-opportunities">
        ${renderInvoiceOpportunity({
          title: t("invoicePlayerSide"),
          amount: annualSideAmount,
          currency,
          client: data.player_name,
          payer,
          frequency: resolveCommission(data).payment_frequency,
          instalments: resolveCommission(data).instalments_per_period
        })}

        ${
          isDual
            ? renderInvoiceOpportunity({
                title: t("invoiceClubSide"),
                amount: annualSideAmount,
                currency,
                client: data.club_name,
                payer: data.club_name || payer,
                frequency: resolveCommission(data).payment_frequency,
                instalments: resolveCommission(data).instalments_per_period
              })
            : ""
        }
      </div>

      <p class="invoice-forecast-note">
        ${t("invoiceForecastNote")}
      </p>
    </section>
  `;
}

    async function reanalyseStoredContract(db, contractId) {
      const button = document.getElementById("reanalyseContractBtn");
      if (!button || !currentUser || !contractId) return;

      if (!window.confirm(t("reanalyseConfirm"))) return;

      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = t("reanalyseStarting");

      try {
        /*
          Upload-contract stores every PDF under:
          <user_id>/<contract_id>/<timestamp>-<index>-<filename>

          Re-analysis lists that exact folder and sends the stored package
          back to the existing analyse-contract Edge Function. No dates,
          percentages, fee splits or player-specific rules are hard-coded.
        */
        const STORAGE_BUCKET = "dealtrack-contracts";
        const folderPath = `${currentUser.id}/${contractId}`;

        const { data: storedFiles, error: listError } = await db.storage
          .from(STORAGE_BUCKET)
          .list(folderPath, {
            limit: 100,
            sortBy: { column: "name", order: "asc" }
          });

        if (listError) {
          throw listError;
        }

        const pdfFiles = (Array.isArray(storedFiles) ? storedFiles : [])
          .filter((item) => item?.name && !item.name.endsWith("/"))
          .filter((item) => String(item.name).toLowerCase().endsWith(".pdf"));

        if (!pdfFiles.length) {
          alert(t("reanalyseNoDocuments"));
          return;
        }

        const documents = pdfFiles.map((item) => {
          const storedName = String(item.name);
          const originalName = storedName.replace(/^\d+-\d+-/, "");
          const metadata = item.metadata || {};

          return {
            storage_bucket: STORAGE_BUCKET,
            storage_path: `${folderPath}/${storedName}`,
            original_file_name: originalName || storedName,
            mime_type: metadata.mimetype || metadata.contentType || "application/pdf",
            file_size: metadata.size || null
          };
        });

        console.log("DealTrack re-analysis package:", documents);

        const { data: analysisResponse, error: analysisError } =
          await db.functions.invoke("analyse-contract", {
            body: {
              contract_id: contractId,
              documents,
              language: currentLang
            }
          });

        if (analysisError) {
          /*
            A long analysis can finish and save successfully just after the
            browser/Supabase HTTP connection closes. Verify the persisted
            contract status before reporting a failure to the user.
          */
          const { data: statusRecord } = await db
            .from("contracts")
            .select("analysis_status")
            .eq("id", contractId)
            .eq("user_id", currentUser.id)
            .maybeSingle();

          const persistedStatus = String(statusRecord?.analysis_status || "")
            .trim()
            .toLowerCase();

          if (["review_required", "analysed", "analyzed", "completed", "complete"].includes(persistedStatus)) {
            button.textContent = t("reanalyseSuccess");
            window.setTimeout(() => window.location.reload(), 500);
            return;
          }

          let detailedMessage = analysisError?.message || t("reanalyseFailed");
          try {
            const errorBody = await analysisError?.context?.clone?.().json?.();
            if (errorBody?.error) detailedMessage = errorBody.error;
          } catch {
            // The connection may already be closed; retain the available message.
          }

          throw new Error(detailedMessage);
        }

        if (analysisResponse?.success === false) {
          throw new Error(
            analysisResponse?.error || t("reanalyseFailed")
          );
        }

        console.log("DealTrack re-analysis response:", analysisResponse);

        button.textContent = t("reanalyseSuccess");

        // Reload only after the Edge Function has finished so the page
        // fetches freshly-written commission_instalments rows.
        window.setTimeout(() => {
          window.location.reload();
        }, 900);
      } catch (error) {
        console.error("DealTrack contract re-analysis failed:", error);
        alert(
          `${t("reanalyseFailed")} ${error?.message || ""}`.trim()
        );
      } finally {
        window.setTimeout(() => {
          if (button && document.body.contains(button)) {
            button.disabled = false;
            button.textContent = originalText || t("reanalyseContractBtn");
          }
        }, 1200);
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      applyStaticTranslations();

      document.querySelectorAll("[data-lang-btn]").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentLang = btn.getAttribute("data-lang-btn");
          localStorage.setItem("lang", currentLang);
          applyStaticTranslations();
          renderIdentityBar();
          if (currentContract) renderContract(currentContract);
        });
      });

      const db = window.supabaseClient || window.sb || null;
      const container = document.getElementById("contractView");

      if (!db) {
        container.innerHTML = `<div class="status-box">${t("errorSupabase")}</div>`;
        return;
      }

      currentDb = db;

      const { data: { user }, error: userError } = await db.auth.getUser();

      if (userError || !user) {
        window.location.href = "/dealtrack-pro/login.html";
        return;
      }

      currentUser = user;
      currentAgency = await loadAgencyContext(db);
      renderIdentityBar();

      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          await db.auth.signOut();
          window.location.href = "/dealtrack-pro/login.html";
        });
      }

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      const addClauseBtn = document.getElementById("addClauseBtn");
      if (addClauseBtn && id) {
        addClauseBtn.href = `/dealtrack-pro/add-clause.html?contract_id=${id}`;
      }

      const editContractBtn = document.getElementById("editContractBtn");
      if (editContractBtn && id) {
        editContractBtn.href = `/dealtrack-pro/edit-contract.html?id=${id}`;
      }

      const reanalyseContractBtn = document.getElementById("reanalyseContractBtn");
      if (reanalyseContractBtn && id) {
        reanalyseContractBtn.addEventListener("click", () => {
          reanalyseStoredContract(db, id);
        });
      }

      if (!id) {
        container.innerHTML = `<div class="status-box">${t("errorMissingId")}</div>`;
        return;
      }

      const { data, error } = await db
        .from("contracts")
        .select("*")
        .eq("id", id)
        .eq("user_id", user.id)
        .single();

      if (error || !data) {
        console.error("Load contract error:", error);
        container.innerHTML = `<div class="status-box">${t("errorNotFound")}</div>`;
        return;
      }

      currentContract = data;
      currentContractInstalments = [];

      const directInstalments = await db
        .from("commission_instalments")
        .select("*")
        .eq("contract_id", id)
        .order("due_date", { ascending: true })
        .order("instalment_number", { ascending: true });

      if (
        !directInstalments.error &&
        Array.isArray(directInstalments.data)
      ) {
        currentContractInstalments =
          directInstalments.data;
      }

      if (
        directInstalments.error ||
        currentContractInstalments.length === 0
      ) {
        const rpcResult = await db.rpc(
          "get_my_commission_instalments"
        );

        if (
          !rpcResult.error &&
          Array.isArray(rpcResult.data)
        ) {
          currentContractInstalments =
            rpcResult.data.filter(
              (item) =>
                String(item.contract_id) === String(id)
            );
        }
      }

      applyStaticTranslations();
      renderContract(data);
    });
  </script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DealTrack Pro - Invoices</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/agent-academy/js/supabase-client.js"></script>
  <style>
    :root{--bg:#07101d;--panel:#101c2d;--gold:#f0c53f;--muted:#aeb8c8;--line:#293950}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17263d,#07101d 55%);color:#f8f5e9;font:15px/1.45 Arial,sans-serif}.shell{max-width:1250px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}h1{margin:0;font-size:34px}h1 span{color:var(--gold)}.btn{display:inline-block;border:1px solid #40516b;border-radius:11px;padding:10px 15px;color:#fff;text-decoration:none;background:#14243a;font-weight:700}.lang.active{background:#49cceb;color:#07101d}.lang{border:1px solid #40516b;border-radius:9px;padding:9px 12px;color:#fff;background:#14243a}.status{border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--muted);margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.card,.table-wrap{background:rgba(16,28,45,.94);border:1px solid var(--line);border-radius:17px;padding:20px}.card small{color:var(--muted);text-transform:uppercase;font-weight:800}.card strong{display:block;color:var(--gold);font-size:28px;margin-top:8px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}select,input{background:#091525;color:#fff;border:1px solid #34465f;border-radius:9px;padding:10px 12px}input{min-width:260px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}.amount{color:var(--gold);font-weight:800}.badge{display:inline-block;border:1px solid #485970;border-radius:999px;padding:4px 9px;font-size:12px}.badge.finalised{color:#b9f6d0;border-color:#34795a}.badge.draft{color:#ffe3a7;border-color:#8d6e28}.badge.void{color:#ffc1c8;border-color:#8c4851}@media(max-width:800px){.cards{grid-template-columns:1fr}.table-wrap{overflow:auto}.shell{padding:14px}}
  </style>
</head>
<body><div class="shell"><header class="head"><div><div>DealTrack Pro</div><h1 data-i18n="title">Invoice <span>Register</span></h1></div><div><a class="btn" href="/dealtrack-pro/agency-dashboard.html" data-i18n="back">Back to dashboard</a> <button class="lang active" data-lang="en">EN</button> <button class="lang" data-lang="fr">FR</button> <button class="lang" data-lang="es">ES</button></div></header>
<div id="status" class="status">Loading invoices...</div><section class="cards"><div class="card"><small data-i18n="drafts">Draft invoices</small><strong id="draftCount">0</strong></div><div class="card"><small data-i18n="issued">Finalised invoices</small><strong id="issuedCount">0</strong></div><div class="card"><small data-i18n="value">Finalised value</small><strong id="issuedValue">-</strong></div></section>
<section class="table-wrap"><div class="filters"><select id="statusFilter"><option value="" data-i18n="all">All statuses</option><option value="draft">Draft</option><option value="finalised">Finalised</option><option value="void">Void</option></select><input id="search" type="search" placeholder="Search invoice number or payer"></div><table><thead><tr><th data-i18n="number">Invoice</th><th data-i18n="date">Date</th><th data-i18n="payer">Payer</th><th data-i18n="amount">Amount</th><th data-i18n="statusLabel">Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></section></div>
<script>
const T={en:{title:'Invoice register',back:'Back to dashboard',drafts:'Draft invoices',issued:'Finalised invoices',value:'Finalised value',all:'All statuses',number:'Invoice',date:'Date',payer:'Payer',amount:'Amount',statusLabel:'Status',open:'Open',empty:'No invoices recorded yet.'},fr:{title:'Registre des factures',back:'Retour au tableau de bord',drafts:'Brouillons',issued:'Factures finalisées',value:'Valeur finalisée',all:'Tous les statuts',number:'Facture',date:'Date',payer:'Payeur',amount:'Montant',statusLabel:'Statut',open:'Ouvrir',empty:'Aucune facture enregistrée.'},es:{title:'Registro de facturas',back:'Volver al panel',drafts:'Borradores',issued:'Facturas finalizadas',value:'Valor finalizado',all:'Todos los estados',number:'Factura',date:'Fecha',payer:'Pagador',amount:'Importe',statusLabel:'Estado',open:'Abrir',empty:'Todavía no hay facturas registradas.'}};let lang=localStorage.getItem('lang')||'en',data=[];const $=id=>document.getElementById(id),tr=k=>T[lang]?.[k]||T.en[k]||k,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function money(v,c){return new Intl.NumberFormat(lang==='fr'?'fr-FR':lang==='es'?'es-ES':'en-GB',{style:'currency',currency:c}).format(Number(v)||0)}function apply(){document.querySelectorAll('[data-i18n]').forEach(x=>x.textContent=tr(x.dataset.i18n));document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));render()}function render(){const f=$('statusFilter').value,q=$('search').value.trim().toLowerCase(),rows=data.filter(x=>(!f||x.status===f)&&(!q||`${x.invoice_number||''} ${x.buyer_name||''}`.toLowerCase().includes(q)));$('rows').innerHTML=rows.length?rows.map(x=>`<tr><td><b>${esc(x.invoice_number||'DRAFT')}</b></td><td>${esc(x.issue_date||'-')}</td><td>${esc(x.buyer_name)}</td><td class="amount">${money(x.total_amount,x.currency)}</td><td><span class="badge ${esc(x.status)}">${esc(x.status)}</span></td><td><a class="btn" href="/dealtrack-pro/invoice.html?invoice_id=${encodeURIComponent(x.id)}">${tr('open')}</a></td></tr>`).join(''):`<tr><td colspan="6">${tr('empty')}</td></tr>`;$('draftCount').textContent=data.filter(x=>x.status==='draft').length;$('issuedCount').textContent=data.filter(x=>x.status==='finalised').length;const currencies=[...new Set(data.filter(x=>x.status==='finalised').map(x=>x.currency))];$('issuedValue').textContent=currencies.length===1?money(data.filter(x=>x.status==='finalised').reduce((s,x)=>s+Number(x.total_amount||0),0),currencies[0]):currencies.map(c=>money(data.filter(x=>x.status==='finalised'&&x.currency===c).reduce((s,x)=>s+Number(x.total_amount||0),0),c)).join(' / ')||'-'}
document.addEventListener('DOMContentLoaded',async()=>{const db=window.supabaseClient||window.sb;if(!db){$('status').textContent='Supabase client unavailable.';return}const u=await db.auth.getUser();if(!u.data?.user){location.href='/dealtrack-pro/login.html';return}const r=await db.from('dealtrack_invoices').select('*').order('issue_date',{ascending:false}).order('created_at',{ascending:false});if(r.error){$('status').textContent=r.error.message;return}data=r.data||[];$('status').textContent=`${data.length} invoice(s)`;render()});$('statusFilter').addEventListener('change',render);$('search').addEventListener('input',render);document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;localStorage.setItem('lang',lang);apply()}));apply();
</script></body></html>

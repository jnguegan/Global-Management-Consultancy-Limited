<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DealTrack Pro — Partner Income</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/agent-academy/js/supabase-client.js"></script>
  <script src="/agent-academy/js/auth.js"></script><script src="/agent-academy/js/guard.js"></script>
  <style>
    :root{--bg:#07101f;--panel:#121e31;--line:#34445e;--gold:#f5c542;--blue:#52c7ef;--text:#f7f8fb;--muted:#aeb9ca;--green:#65d6a1;--red:#ff9aa7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07101f,#111e32);color:var(--text);font:15px/1.45 Arial,sans-serif}main{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.top-actions,.langs{display:flex;gap:8px;align-items:center}.lang{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#1d2a3d;color:var(--text);font-weight:800;cursor:pointer}.lang.active{background:var(--blue);color:#06151c}.brand{font-size:23px;font-weight:800}.brand span,h1,h2{color:var(--gold)}h1{margin:4px 0}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#1d2a3d;color:var(--text);text-decoration:none;font-weight:750;cursor:pointer}.btn.primary{background:var(--blue);color:#06151c}.grid{display:grid;grid-template-columns:440px 1fr;gap:18px}.panel{background:rgba(18,30,49,.96);border:1px solid var(--line);border-radius:17px;padding:20px}form{display:grid;gap:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}input,select,textarea{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:9px;padding:11px;background:#091322;color:var(--text)}textarea{min-height:76px}.notice{padding:12px;margin-bottom:15px;border:1px solid var(--line);border-radius:10px}.notice.error{border-color:#984550;color:#ffdce0}.notice.success{border-color:#2d7659;color:#dffff0}.muted{color:var(--muted)}.total{font-size:25px;color:var(--gold);font-weight:850;margin:8px 0 18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid var(--line)}th{font-size:10px;text-transform:uppercase;color:var(--muted)}.amount{color:var(--gold);font-weight:800}@media(max-width:850px){.grid,.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.top-actions{flex-wrap:wrap}.panel{overflow:auto}}
  </style>
</head>
<body><main>
  <div class="top"><div><div class="brand">DealTrack <span>Pro</span></div><h1 data-i18n="title">Partner Income</h1><div id="agencyName" class="muted" data-i18n="loadingAgency">Loading agency…</div></div><div class="top-actions"><a class="btn" href="/dealtrack-pro/agency-dashboard.html" data-i18n="back">← Agency Dashboard</a><div class="langs"><button class="lang" data-lang="en">EN</button><button class="lang" data-lang="fr">FR</button><button class="lang" data-lang="es">ES</button></div></div></div>
  <div id="notice" class="notice" hidden></div>
  <div class="grid">
    <section class="panel"><h2 data-i18n="formTitle">Record agency entitlement</h2><form id="incomeForm">
      <label><span data-i18n="partner">Partner agency or intermediary</span><input id="partnerName" required></label>
      <div class="row"><label><span data-i18n="playerClient">Player / client</span><input id="playerClient"></label><label><span data-i18n="clubBrand">Club / brand</span><input id="clubBrand"></label></div>
      <label><span data-i18n="reference">Agreement reference</span><input id="agreementReference" data-i18n-placeholder="referencePlaceholder" placeholder="Optional contract or mandate reference"></label>
      <div class="row"><label><span data-i18n="entitlementType">Entitlement type</span><select id="entitlementType"><option value="fixed_amount" data-i18n="fixedAmount">Fixed amount</option><option value="percentage" data-i18n="percentage">Percentage of partner commission</option></select></label><label><span data-i18n="currency">Currency</span><input id="currency" value="EUR" maxlength="3"></label></div>
      <div id="grossWrap" hidden><label><span data-i18n="grossCommission">Partner gross commission</span><input id="grossCommission" type="number" min="0" step="0.01"></label></div>
      <label id="valueLabel"><span id="valueLabelText" data-i18n="fixedEntitlement">Agency fixed entitlement</span><input id="entitlementValue" type="number" min="0" step="0.0001" required></label>
      <div class="notice"><span class="muted" data-i18n="calculated">Calculated agency expected income</span><div id="calculatedIncome" class="total">€0</div></div>
      <label><span data-i18n="trigger">Payment trigger</span><input id="paymentTrigger" data-i18n-placeholder="triggerPlaceholder" placeholder="e.g. When the partner agency receives payment"></label>
      <div class="row"><label><span data-i18n="expectedDate">Expected payment date</span><input id="paymentDate" type="date"></label><label><span data-i18n="status">Status</span><select id="status"><option value="pending" data-i18n="pending">Pending</option><option value="trigger_met" data-i18n="triggerMet">Trigger met</option><option value="invoiced" data-i18n="invoiced">Invoiced</option><option value="received" data-i18n="received">Received</option></select></label></div>
      <label><span data-i18n="notes">Notes</span><textarea id="notes"></textarea></label><button class="btn primary" type="submit" data-i18n="save">Save partner income</button>
    </form></section>
    <section class="panel"><h2 data-i18n="recordedTitle">Recorded partner income</h2><div id="summary" class="total">—</div><table><thead><tr><th data-i18n="partnerShort">Partner</th><th data-i18n="playerClientShort">Player/client</th><th data-i18n="expectedDateShort">Expected date</th><th data-i18n="income">Agency income</th><th data-i18n="status">Status</th></tr></thead><tbody id="rows"></tbody></table></section>
  </div>
<script>
let db,user,agency,records=[];const el=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const I18N={en:{title:'Partner Income',loadingAgency:'Loading agency…',back:'← Agency Dashboard',formTitle:'Record BS Group entitlement',partner:'Partner agency or intermediary',playerClient:'Player / client',clubBrand:'Club / brand',reference:'Agreement reference',referencePlaceholder:'Optional contract or mandate reference',entitlementType:'Entitlement type',fixedAmount:'Fixed amount',percentage:'Percentage of partner commission',currency:'Currency',grossCommission:'Partner gross commission',fixedEntitlement:'BS Group fixed entitlement',percentageEntitlement:'BS Group percentage entitlement',calculated:'Calculated BS Group expected income',trigger:'Payment trigger',triggerPlaceholder:'e.g. When the partner agency receives payment',expectedDate:'Expected payment date',status:'Status',pending:'Pending',triggerMet:'Trigger met',invoiced:'Invoiced',received:'Received',notes:'Notes',save:'Save partner income',recordedTitle:'Recorded partner income',partnerShort:'Partner',playerClientShort:'Player/client',expectedDateShort:'Expected date',income:'BS Group income',noRecords:'No partner income recorded',triggerBased:'Trigger-based',saved:'Partner income saved for BS Group.',noAgency:'No agency is assigned to this login.',clientUnavailable:'Supabase client is unavailable.'},fr:{title:'Revenus de partenaires',loadingAgency:'Chargement de l’agence…',back:'← Tableau de bord',formTitle:'Enregistrer le droit de BS Group',partner:'Agence partenaire ou intermédiaire',playerClient:'Joueur / client',clubBrand:'Club / marque',reference:'Référence de l’accord',referencePlaceholder:'Référence facultative du contrat ou mandat',entitlementType:'Type de rémunération',fixedAmount:'Montant fixe',percentage:'Pourcentage de la commission du partenaire',currency:'Devise',grossCommission:'Commission brute du partenaire',fixedEntitlement:'Rémunération fixe de BS Group',percentageEntitlement:'Pourcentage revenant à BS Group',calculated:'Revenu prévisionnel calculé de BS Group',trigger:'Déclencheur de paiement',triggerPlaceholder:'ex. Lorsque l’agence partenaire reçoit le paiement',expectedDate:'Date de paiement prévue',status:'Statut',pending:'En attente',triggerMet:'Condition remplie',invoiced:'Facturé',received:'Reçu',notes:'Notes',save:'Enregistrer le revenu partenaire',recordedTitle:'Revenus partenaires enregistrés',partnerShort:'Partenaire',playerClientShort:'Joueur/client',expectedDateShort:'Date prévue',income:'Revenu BS Group',noRecords:'Aucun revenu partenaire enregistré',triggerBased:'Selon déclencheur',saved:'Revenu partenaire enregistré pour BS Group.',noAgency:'Aucune agence n’est attribuée à cette connexion.',clientUnavailable:'Le client Supabase est indisponible.'},es:{title:'Ingresos de socios',loadingAgency:'Cargando agencia…',back:'← Panel de la agencia',formTitle:'Registrar el derecho de BS Group',partner:'Agencia socia o intermediario',playerClient:'Jugador / cliente',clubBrand:'Club / marca',reference:'Referencia del acuerdo',referencePlaceholder:'Referencia opcional del contrato o mandato',entitlementType:'Tipo de derecho',fixedAmount:'Importe fijo',percentage:'Porcentaje de la comisión del socio',currency:'Moneda',grossCommission:'Comisión bruta del socio',fixedEntitlement:'Derecho fijo de BS Group',percentageEntitlement:'Porcentaje correspondiente a BS Group',calculated:'Ingreso previsto calculado de BS Group',trigger:'Condición de pago',triggerPlaceholder:'p. ej., cuando la agencia socia reciba el pago',expectedDate:'Fecha de pago prevista',status:'Estado',pending:'Pendiente',triggerMet:'Condición cumplida',invoiced:'Facturado',received:'Recibido',notes:'Notas',save:'Guardar ingreso del socio',recordedTitle:'Ingresos de socios registrados',partnerShort:'Socio',playerClientShort:'Jugador/cliente',expectedDateShort:'Fecha prevista',income:'Ingreso BS Group',noRecords:'No hay ingresos de socios registrados',triggerBased:'Según condición',saved:'Ingreso del socio guardado para BS Group.',noAgency:'No hay una agencia asignada a este inicio de sesión.',clientUnavailable:'El cliente de Supabase no está disponible.'}};
Object.assign(I18N.en,{formTitle:'Record agency entitlement',fixedEntitlement:'Agency fixed entitlement',percentageEntitlement:'Agency percentage entitlement',calculated:'Calculated agency expected income',income:'Agency income',saved:'Partner income saved for your agency.'});
Object.assign(I18N.fr,{formTitle:'Enregistrer le droit de l’agence',fixedEntitlement:'Rémunération fixe de l’agence',percentageEntitlement:'Pourcentage revenant à l’agence',calculated:'Revenu prévisionnel calculé de l’agence',income:'Revenu de l’agence',saved:'Revenu partenaire enregistré pour votre agence.'});
Object.assign(I18N.es,{formTitle:'Registrar el derecho de la agencia',fixedEntitlement:'Derecho fijo de la agencia',percentageEntitlement:'Porcentaje correspondiente a la agencia',calculated:'Ingreso previsto calculado de la agencia',income:'Ingreso de la agencia',saved:'Ingreso del socio guardado para su agencia.'});
let lang=localStorage.getItem('dealtrackLanguage')||'en';const t=k=>I18N[lang]?.[k]||I18N.en[k]||k;function applyLanguage(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(n=>n.textContent=t(n.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(n=>n.placeholder=t(n.dataset.i18nPlaceholder));document.querySelectorAll('[data-lang]').forEach(n=>n.classList.toggle('active',n.dataset.lang===lang));if(agency)el('agencyName').textContent=agency.legal_name||agency.name||'Current agency';el('valueLabelText').textContent=t(el('entitlementType').value==='percentage'?'percentageEntitlement':'fixedEntitlement');renderRecords()}
const show=(m,t='success')=>{const n=el('notice');n.textContent=m;n.className=`notice ${t}`;n.hidden=false};const money=(v,c='EUR')=>new Intl.NumberFormat({en:'en-GB',fr:'fr-FR',es:'es-ES'}[lang]||'en-GB',{style:'currency',currency:c}).format(Number(v)||0);
async function rpc(name,args={}){const {data,error}=await db.rpc(name,args);if(error)throw error;return data}
function calculate(){const type=el('entitlementType').value,value=Number(el('entitlementValue').value)||0,gross=Number(el('grossCommission').value)||0,amount=type==='percentage'?gross*value/100:value;el('calculatedIncome').textContent=money(amount,(el('currency').value||'EUR').toUpperCase())}
function statusText(s){return t({pending:'pending',trigger_met:'triggerMet',invoiced:'invoiced',received:'received'}[s]||s)}function renderRecords(){if(!el('rows'))return;let totals={};records.forEach(r=>totals[r.currency]=(totals[r.currency]||0)+Number(r.expected_income||0));el('summary').textContent=Object.entries(totals).map(([c,v])=>money(v,c)).join(' · ')||t('noRecords');el('rows').innerHTML=records.length?records.map(r=>`<tr><td>${esc(r.partner_name)}</td><td>${esc(r.player_or_client||'—')}</td><td>${esc(r.expected_payment_date||t('triggerBased'))}</td><td class="amount">${esc(money(r.expected_income,r.currency))}</td><td>${esc(statusText(r.status))}</td></tr>`).join(''):`<tr><td colspan="5">${esc(t('noRecords'))}</td></tr>`}async function load(){records=await rpc('list_partner_income',{p_agency_id:agency.agency_id});renderRecords()}
document.addEventListener('DOMContentLoaded',async()=>{applyLanguage();document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;localStorage.setItem('dealtrackLanguage',lang);applyLanguage()}));db=window.supabaseClient||window.sb;if(!db){show(t('clientUnavailable'),'error');return}const result=await db.auth.getUser();user=result.data?.user;if(!user){location.href='/dealtrack-pro/login.html';return}try{const ctx=await rpc('get_my_agency_context');agency=Array.isArray(ctx)?ctx[0]:ctx;if(!agency?.agency_id)throw new Error(t('noAgency'));el('agencyName').textContent=agency.legal_name||agency.name||'Current agency';await load()}catch(e){show(e.message,'error');return}
el('entitlementType').addEventListener('change',()=>{const pct=el('entitlementType').value==='percentage';el('grossWrap').hidden=!pct;el('grossCommission').required=pct;el('valueLabelText').textContent=t(pct?'percentageEntitlement':'fixedEntitlement');calculate()});['grossCommission','entitlementValue','currency'].forEach(id=>el(id).addEventListener('input',calculate));
el('incomeForm').addEventListener('submit',async e=>{e.preventDefault();try{await rpc('create_partner_income',{p_agency_id:agency.agency_id,p_partner_name:el('partnerName').value,p_player_or_client:el('playerClient').value||null,p_club_or_brand:el('clubBrand').value||null,p_agreement_reference:el('agreementReference').value||null,p_currency:el('currency').value||'EUR',p_partner_gross_commission:el('entitlementType').value==='percentage'?Number(el('grossCommission').value):null,p_entitlement_type:el('entitlementType').value,p_entitlement_value:Number(el('entitlementValue').value),p_payment_trigger:el('paymentTrigger').value||null,p_expected_payment_date:el('paymentDate').value||null,p_status:el('status').value,p_notes:el('notes').value||null});e.target.reset();el('currency').value='EUR';calculate();await load();show(t('saved'))}catch(error){show(error.message,'error')}})});
</script></main></body></html>

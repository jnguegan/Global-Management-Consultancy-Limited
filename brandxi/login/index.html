<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign In | BRAND XI</title>

    <style>
        :root {
            --bg: #0B0D10;
            --panel: #171A20;
            --text: #FFFFFF;
            --muted: #9DA5B4;
            --line: rgba(255, 255, 255, 0.09);
            --blue: #245CFF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 80% 0,
                    rgba(36, 92, 255, 0.18),
                    transparent 30%
                ),
                var(--bg);
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .wrap {
            width: min(1180px, calc(100% - 32px));
            margin: auto;
        }

        header {
            border-bottom: 1px solid var(--line);
            background: rgba(11, 13, 16, 0.88);
        }

        header .wrap {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-weight: 900;
            font-size: 22px;
        }

        .xi,
        .blue {
            color: var(--blue);
        }

        nav {
            display: flex;
            gap: 18px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }

        main {
            min-height: calc(100vh - 72px);
            display: grid;
            place-items: center;
            padding: 50px 16px;
        }

        .login-shell {
            width: min(470px, 100%);
        }

        .eyebrow {
            color: #9bb3ff;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        h1 {
            margin: 12px 0 10px;
            font-size: clamp(42px, 7vw, 66px);
            letter-spacing: -0.05em;
            line-height: 0.95;
        }

        .intro {
            color: var(--muted);
            line-height: 1.65;
            margin-bottom: 26px;
        }

        .card {
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.045),
                rgba(255, 255, 255, 0.018)
            );
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 26px;
        }

        label {
            display: block;
            color: #c8cdd5;
            font-size: 13px;
            font-weight: 800;
            margin: 16px 0 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: #0e1116;
            color: #fff;
            font-size: 16px;
        }

        input:focus {
            outline: 1px solid var(--blue);
            border-color: var(--blue);
        }

        button {
            width: 100%;
            margin-top: 22px;
            border: 0;
            border-radius: 12px;
            background: var(--blue);
            color: #fff;
            font-weight: 850;
            font-size: 15px;
            padding: 15px 18px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .status {
            min-height: 24px;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .status.error {
            color: #ff9c9c;
        }

        .status.success {
            color: #a8ffbf;
        }

        /*
         * BRAND XI registration option.
         *
         * This takes new BRAND XI customers to the BRAND XI
         * onboarding process.
         *
         * The registration process will recognise existing
         * GlobalMGM/Supabase identities so that we do not create
         * duplicate accounts for DealTrack Pro users.
         */
        .signup-option {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .signup-option a {
            display: block;
            margin-top: 8px;
            color: #9bb3ff;
            font-weight: 800;
        }

        .signup-option a:hover {
            color: #ffffff;
        }

        .footnote {
            margin-top: 18px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 700px) {
            nav {
                display: none;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="wrap">

            <a class="logo" href="/brandxi/">
                BRAND <span class="xi">XI</span>&trade;
            </a>

            <nav>
                <a href="/brandxi/">
                    Home
                </a>

                <a href="/brandxi/players/">
                    Find a Player
                </a>

                <a href="/brandxi/start/">
                    Create Brand ID
                </a>
            </nav>

        </div>
    </header>

    <main>

        <div class="login-shell">

            <span class="eyebrow">
                BRAND XI ACCESS
            </span>

            <h1>
                Welcome
                <span class="blue">
                    back.
                </span>
            </h1>

            <p class="intro">
                Sign in to access your BRAND XI workspace,
                player profile, analytics and brand services.
            </p>

            <section class="card">

                <form id="loginForm">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                    >

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        id="loginButton"
                        type="submit"
                    >
                        Sign in to BRAND XI &rarr;
                    </button>

                    <p
                        id="status"
                        class="status"
                    ></p>

                </form>

                <!--
                    New BRAND XI registration.

                    Existing GlobalMGM users will eventually be
                    recognised during onboarding rather than being
                    given a duplicate Supabase identity.
                -->

                <div class="signup-option">

                    <span>
                        New to BRAND XI?
                    </span>

                    <a href="/brandxi/register/">
                        Create your account &rarr;
                    </a>

                </div>

            </section>

            <p class="footnote">
                Access is limited to authorised BRAND XI users.
            </p>

        </div>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script>

        const SUPABASE_URL =
            "https://ysaxtuvuzqkyfmganven.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_esfhuUEIcUJEL6z9zryRAA_FGMmUHlw";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const statusMessage =
            document.getElementById("status");


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                loginButton.disabled = true;

                loginButton.textContent =
                    "Signing in...";


                statusMessage.className =
                    "status";

                statusMessage.textContent =
                    "";


                /*
                 * BRAND XI shares the GlobalMGM Supabase
                 * authentication project.
                 *
                 * Authentication establishes the user's identity.
                 *
                 * BRAND XI access and permissions are handled
                 * separately by the BRAND XI application.
                 */

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });


                if (error) {

                    console.error(
                        "BRAND XI sign-in failed:",
                        error
                    );

                    statusMessage.className =
                        "status error";

                    statusMessage.textContent =
                        "We could not sign you in. Please check your email and password.";

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Sign in to BRAND XI →";

                    return;
                }


                if (!data.user) {

                    statusMessage.className =
                        "status error";

                    statusMessage.textContent =
                        "No authenticated user was returned.";

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Sign in to BRAND XI →";

                    return;
                }


                statusMessage.className =
                    "status success";

                statusMessage.textContent =
                    "Signed in. Opening your BRAND XI workspace...";


                /*
                 * Next phase:
                 *
                 * BRAND XI will determine the user's product
                 * membership and role before selecting the
                 * appropriate dashboard.
                 */

                window.location.href =
                    "/brandxi/app/player/";

            }
        );

    </script>

</body>
</html>

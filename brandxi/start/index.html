<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Create Brand ID | BRAND XI
  </title>
  <style>
   :root{--bg:#0B0D10;--panel:#171A20;--soft:#11151b;--text:#fff;--muted:#9DA5B4;--line:rgba(255,255,255,.09);--blue:#245CFF}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(36,92,255,.14),transparent 28%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}header{border-bottom:1px solid var(--line);background:rgba(11,13,16,.88);position:sticky;top:0;z-index:5}header .wrap{height:72px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;font-size:22px}.xi,.blue{color:var(--blue)}nav{display:flex;gap:18px;color:var(--muted);font-size:14px;font-weight:700}main{padding:50px 0 80px}h1{font-size:clamp(38px,6vw,68px);letter-spacing:-.05em;margin:10px 0}h2{margin:0 0 18px}p{color:var(--muted);line-height:1.65}.eyebrow{color:#9bb3ff;font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:22px;padding:22px}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}label{display:block;color:#c8cdd5;font-size:13px;font-weight:800;margin:14px 0 7px}input,select,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0e1116;color:#fff}textarea{min-height:105px}button,.btn{display:inline-flex;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:850;padding:14px 18px;cursor:pointer}.secondary{background:transparent;border:1px solid var(--line)}.metric b{display:block;font-size:30px;margin-top:8px}.metric small,.muted{color:var(--muted)}.progress{height:9px;border-radius:20px;background:#242832;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 8px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}.tag{display:inline-block;padding:6px 9px;border:1px solid rgba(36,92,255,.3);background:rgba(36,92,255,.12);border-radius:999px;font-size:11px;color:#b8c7ff}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.tabs a{padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}@media(max-width:800px){.span8,.span6,.span4,.span3{grid-column:1/-1}nav{display:none}}
  </style>
 </head>
 <body>
  <header>
   <div class="wrap">
    <a class="logo" href="/brandxi/">
     BRAND
     <span class="xi">
      XI
     </span>
     &trade;
    </a>
    <nav>
     <a href="/brandxi/players/">
      Find a Player
     </a>
     <a href="/brandxi/start/">
      Create Brand ID
     </a>
    </nav>
   </div>
  </header>
  <main class="wrap">
   <span class="eyebrow">
    CREATE PLAYER BRAND
   </span>
   <h1>
    Start a new
    <span class="blue">
     Brand ID.
    </span>
   </h1>
   <p>
    Only the essentials first. BRAND XI can build the rest progressively with the player or authorised representative.
   </p>
   <form class="grid" id="brandxiStartForm">
    <section class="card span8">
     <h2>
      Player
     </h2>
     <div class="grid">
      <div class="span6">
       <label>
        First name
       </label>
       <input id="first_name" name="first_name" placeholder="First name" required=""/>
      </div>
      <div class="span6">
       <label>
        Surname
       </label>
       <input id="surname" name="surname" placeholder="Surname" required=""/>
      </div>
      <div class="span6">
       <label>
        Current club
       </label>
       <input id="current_club" name="current_club" placeholder="Club"/>
      </div>
      <div class="span6">
       <label>
        Position
       </label>
       <input id="position" name="position" placeholder="Position"/>
      </div>
      <div class="span6">
       <label>
        Nationality
       </label>
       <input id="nationality" name="nationality" placeholder="Nationality"/>
      </div>
      <div class="span6">
       <label>
        Player communication language
       </label>
       <select id="creator_role" name="creator_role">
        <option>
         English
        </option>
        <option>
         French
        </option>
        <option>
         Spanish
        </option>
       </select>
      </div>
     </div>
    </section>
    <aside class="card span4">
     <h2>
      Who are you?
     </h2>
     <label>
      Relationship
     </label>
     <select id="communication_language" name="communication_language">
      <option>
       The player
      </option>
      <option>
       Football agent / agency
      </option>
      <option>
       Family member
      </option>
      <option>
       PR / Brand manager
      </option>
      <option>
       Other authorised representative
      </option>
     </select>
     <label>
      Primary website language
     </label>
     <select id="primary_website_language" name="primary_website_language">
      <option>
       English
      </option>
      <option>
       French
      </option>
      <option>
       Spanish
      </option>
     </select>
     <label>
      Additional languages
     </label>
     <input id="additional_languages" name="additional_languages" placeholder="e.g. French, Spanish"/>
     <br/>
     <br/>
     <div id="formStatus" style="grid-column:1/-1;min-height:24px;color:#9DA5B4;font-size:14px;">
     </div>
     <button>
      Create Brand ID &rarr;
     </button>
    </aside>
   </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>
  <script>
   const SUPABASE_URL = "https://ysaxtuvuzqkyfmganven.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_esfhuUEIcUJEL6z9zryRAA_FGMmUHlw";
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const brandForm = document.getElementById("brandxiStartForm");
const formStatus = document.getElementById("formStatus");

function createBrandId() {
  const randomPart = crypto.randomUUID().replaceAll("-", "").slice(0, 10).toUpperCase();
  return `BX-${randomPart}`;
}

brandForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const submitButton = brandForm.querySelector('button[type="submit"], button');
  submitButton.disabled = true;
  formStatus.textContent = "Creating your BRAND XI profile...";

  const formData = new FormData(brandForm);

  const player = {
    brand_id: createBrandId(),
    first_name: String(formData.get("first_name") || "").trim(),
    surname: String(formData.get("surname") || "").trim(),
    current_club: String(formData.get("current_club") || "").trim() || null,
    position: String(formData.get("position") || "").trim() || null,
    nationality: String(formData.get("nationality") || "").trim() || null,
    communication_language: String(formData.get("communication_language") || "en"),
    primary_website_language: String(formData.get("primary_website_language") || "en")
  };

  try {
    const { error } = await supabaseClient
      .from("brandxi_players")
      .insert(player);

    if (error) {
      throw error;
    }

    sessionStorage.setItem("brandxi_brand_id", player.brand_id);
    window.location.href = "../app/player/";
  } catch (error) {
    console.error("BRAND XI player creation failed:", error);
    formStatus.textContent =
      "We could not create the Brand ID yet. Please try again or contact BRAND XI support.";
    submitButton.disabled = false;
  }
});
  </script>
 </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRAND XI Onboarding</title>
<style>
:root{--bg:#0b0d10;--text:#fff;--muted:#9da5b4;--line:rgba(255,255,255,.09);--blue:#245cff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,rgba(36,92,255,.18),transparent 30%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}header{border-bottom:1px solid var(--line)}
header .wrap{min-height:72px;display:flex;align-items:center}.logo{font-size:22px;font-weight:900}.blue{color:var(--blue)}
main{padding:54px 0 80px}.shell{width:min(760px,100%);margin:auto}.eyebrow{color:#9bb3ff;font-size:11px;font-weight:900;letter-spacing:.13em}
h1{margin:12px 0;font-size:clamp(42px,7vw,66px);line-height:.98;letter-spacing:-.05em}.intro{color:var(--muted);line-height:1.65;margin-bottom:28px}
.card{padding:30px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.03)}
h2{margin:0 0 8px}.question{color:var(--muted);margin:0 0 22px;line-height:1.55}
.types{display:grid;grid-template-columns:1fr 1fr;gap:14px}.type{position:relative}.type input{position:absolute;opacity:0}
.type label{display:block;height:100%;padding:19px;border:1px solid var(--line);border-radius:14px;background:#0e1116;cursor:pointer}
.type strong{display:block;margin-bottom:7px}.type span{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.type input:checked+label{border-color:var(--blue);background:rgba(36,92,255,.12);box-shadow:inset 0 0 0 1px var(--blue)}
button{width:100%;margin-top:22px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:850;font-size:15px;padding:15px;cursor:pointer}
.account{margin-bottom:22px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#0e1116;color:var(--muted);font-size:13px}
.account strong{color:#fff}.status{margin-top:14px;color:var(--muted);font-size:13px}.error{color:#ff9c9c}
@media(max-width:650px){.types{grid-template-columns:1fr}.card{padding:22px}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="/brandxi/">BRAND <span class="blue">XI</span>&trade;</a></div></header>
<main><div class="shell">
<span class="eyebrow">BRAND XI ONBOARDING</span>
<h1>Welcome to <span class="blue">BRAND XI.</span></h1>
<p class="intro">Your GlobalMGM identity has been verified. Now tell us how you will use BRAND XI.</p>

<section class="card">
<div class="account">Signed in as <strong id="email">Checking account...</strong></div>
<h2>Choose your account type</h2>
<p class="question">This determines the onboarding journey and workspace we prepare for you.</p>

<form id="form">
<div class="types">
<div class="type"><input id="agency" name="type" type="radio" value="agency" checked><label for="agency"><strong>Football Agent / Agency</strong><span>Manage BRAND XI profiles for one or more professional players.</span></label></div>
<div class="type"><input id="player" name="type" type="radio" value="player"><label for="player"><strong>Professional Player</strong><span>Create and manage your own personal brand.</span></label></div>
<div class="type"><input id="representative" name="type" type="radio" value="representative"><label for="representative"><strong>Authorised Representative</strong><span>Manage a player's brand with their authority.</span></label></div>
<div class="type"><input id="guardian" name="type" type="radio" value="guardian"><label for="guardian"><strong>Parent / Guardian</strong><span>Manage BRAND XI access for a young player.</span></label></div>
</div>
<button type="submit">Continue onboarding &rarr;</button>
<p id="status" class="status"></p>
</form>
</section>
</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=window.supabase.createClient("https://ysaxtuvuzqkyfmganven.supabase.co","sb_publishable_esfhuUEIcUJEL6z9zryRAA_FGMmUHlw");
const emailEl=document.getElementById("email");
const statusEl=document.getElementById("status");

(async()=>{
 const {data:{user}}=await client.auth.getUser();
 if(!user){window.location.replace("/brandxi/login/");return;}
 emailEl.textContent=user.email;
})();

document.getElementById("form").addEventListener("submit",(e)=>{
 e.preventDefault();
 const type=document.querySelector('input[name="type"]:checked').value;
 sessionStorage.setItem("brandxi_pending_account_type",type);
 if(type==="agency"){
   window.location.href="/brandxi/onboarding/agency/";
   return;
 }
 statusEl.textContent="This onboarding route will be activated next.";
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRAND XI | Your partner for every opportunity</title>
<meta name="description" content="Discover football and recruitment opportunities with BRAND XI.">
<style>
:root{--blue:#245CFF;--ink:#16243b;--muted:#65738a;--line:#dfe7f2}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#fff 0%,#f2f7ff 100%);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{padding:24px max(24px,5vw);display:flex;justify-content:space-between;align-items:center;gap:20px}
.logo{font-size:23px;font-weight:900;letter-spacing:-1px;text-decoration:none;color:var(--ink)}.logo span{color:var(--blue)}
select{padding:9px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px 70px}
.wrap{width:min(900px,100%);text-align:center}h1{font-size:clamp(38px,6vw,66px);letter-spacing:-.055em;margin:0 0 12px}
.tag{color:var(--muted);font-size:19px;margin:0 0 44px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.choice{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:18px;padding:36px;border:1px solid var(--line);border-radius:25px;background:#fff;box-shadow:0 18px 45px rgba(33,72,135,.06);text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s}
.choice:hover,.choice:focus-visible{transform:translateY(-4px);box-shadow:0 22px 55px rgba(33,72,135,.13);outline:2px solid var(--blue);outline-offset:2px}
.symbol{font-size:38px}.choice h2{font-size:26px;line-height:1.2;margin:0}.choice p{margin:0;color:var(--muted);line-height:1.5}
.cta{margin-top:auto;color:var(--blue);font-weight:800}
footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}
@media(max-width:650px){.choices{grid-template-columns:1fr}.choice{padding:27px}.tag{margin-bottom:30px}}
</style>
</head>
<body>
<header><a class="logo" href="index.html">BRAND <span>XI</span>™</a><select id="language" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="es">ES</option></select></header>
<main><div class="wrap"><h1>BRAND <span style="color:#245CFF">XI</span></h1><p class="tag" data-i18n="tag">Your partner for every opportunity.</p>
<div class="choices">
<a class="choice" href="football.html"><span class="symbol" aria-hidden="true">⚽</span><h2 data-i18n="football">Football Opportunities</h2><p data-i18n="footballDesc">Explore football discovery and the BRAND XI football network.</p><span class="cta" data-i18n="explore">Explore →</span></a>
<a class="choice" href="recruitment.html"><span class="symbol" aria-hidden="true">🌍</span><h2 data-i18n="recruitment">Recruitment Opportunities</h2><p data-i18n="recruitmentDesc">Discover opportunities around the world.</p><span class="cta" data-i18n="explore">Explore →</span></a>
</div></div></main>
<footer>© <span id="year"></span> Global Management Consultancy Limited</footer>
<script>
const translations={
en:{tag:"Your partner for every opportunity.",football:"Football Opportunities",footballDesc:"Explore football discovery and the BRAND XI football network.",recruitment:"Recruitment Opportunities",recruitmentDesc:"Discover opportunities around the world.",explore:"Explore →"},
fr:{tag:"Votre partenaire pour chaque opportunité.",football:"Opportunités Football",footballDesc:"Découvrez le réseau football de BRAND XI.",recruitment:"Opportunités de Recrutement",recruitmentDesc:"Découvrez les opportunités dans le monde.",explore:"Explorer →"},
es:{tag:"Tu aliado para cada oportunidad.",football:"Oportunidades de Fútbol",footballDesc:"Descubre la red de fútbol de BRAND XI.",recruitment:"Oportunidades de Empleo",recruitmentDesc:"Descubre oportunidades en todo el mundo.",explore:"Explorar →"}
};
const picker=document.getElementById("language");picker.value=localStorage.getItem("brandxiLang")||"en";
function setLanguage(lang){document.documentElement.lang=lang;document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=translations[lang][el.dataset.i18n]);localStorage.setItem("brandxiLang",lang)}
picker.addEventListener("change",()=>setLanguage(picker.value));setLanguage(picker.value);document.getElementById("year").textContent=new Date().getFullYear();
</script>
</body></html>
